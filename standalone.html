      if (!flavor) return '';

      // 1. Por imageKey directo
      if (flavor.imageKey && window.BULL_MARKET_ROLL_IMAGES[flavor.imageKey]) {
        return window.BULL_MARKET_ROLL_IMAGES[flavor.imageKey];
      }

      // 2. Mapeo por ID oficial

        'flv-avellanas': 'crema-avellanas',
        'flv-tiramisu': 'tiramisu',
        'flv-ovomaltina': 'ovomaltina',
        'flv-pie-limon': 'pie-limon',
        'flv-frutos-rojos': 'frutos-rojos',
        'flv-dulce-leche': 'dulce-de-leche',
        'flv-cinnamon': 'cinnamon',
        'flv-samba': 'samba',
        'flv-pistacho': 'pistacho',
        'flv-oreo': 'oreo',
      };
      const keyFromId = idMap[flavor.id || ''] || idMap[flavor.flavorId || ''];
      if (keyFromId && window.BULL_MARKET_ROLL_IMAGES[keyFromId]) {
        return window.BULL_MARKET_ROLL_IMAGES[keyFromId];
      }

      // 3. Mapeo por nombre de sabor
      const name = (flavor.name || flavor.flavorName || '').toUpperCase();
      if (name.includes('AVELLANA')) return window.BULL_MARKET_ROLL_IMAGES['crema-avellanas'];
      if (name.includes('TIRAMIS')) return window.BULL_MARKET_ROLL_IMAGES['tiramisu'];
      if (name.includes('OVOMALTINA')) return window.BULL_MARKET_ROLL_IMAGES['ovomaltina'];
      if (name.includes('LIM') || name.includes('PIE')) return window.BULL_MARKET_ROLL_IMAGES['pie-limon'];
      if (name.includes('FRUTOS') || name.includes('ROJOS')) return window.BULL_MARKET_ROLL_IMAGES['frutos-rojos'];
      if (name.includes('LECHE') || name.includes('DULCE')) return window.BULL_MARKET_ROLL_IMAGES['dulce-de-leche'];
      if (name.includes('CINNAMON') || name.includes('CANELA')) return window.BULL_MARKET_ROLL_IMAGES['cinnamon'];
      if (name.includes('SAMBA')) return window.BULL_MARKET_ROLL_IMAGES['samba'];
      if (name.includes('PISTACHO')) return window.BULL_MARKET_ROLL_IMAGES['pistacho'];
      if (name.includes('OREO')) return window.BULL_MARKET_ROLL_IMAGES['oreo'];

      return flavor.imageUrl || '';

    // ============================================================================
    // 2. MOTOR DE AUDIO NATIVO WEB AUDIO API (CAMPANA DOBLE DE COCINA)
    // ============================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      getContext() {
        if (!this.enabled) return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      playBellTone(ctx, freq, startTime, duration, peakGain) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      playNewOrderBell() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        this.playBellTone(ctx, 783.99, now, 0.55, 0.35);
        this.playBellTone(ctx, 1567.98, now, 0.25, 0.12);
        this.playBellTone(ctx, 659.25, now + 0.22, 0.75, 0.38);
        this.playBellTone(ctx, 1318.51, now + 0.22, 0.35, 0.12);
      }

      playOrderDispatchedSound() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          this.playBellTone(ctx, freq, now + idx * 0.07, 0.32, 0.22);
        });
      }

      playTapSound(pitch = 480) {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.045);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      play86Alert() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        this.playBellTone(ctx, 293.66, now, 0.2, 0.25);
        this.playBellTone(ctx, 220.0, now + 0.16, 0.35, 0.28);
      }

      playAnnouncementSound() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        // Campanilla triple de aviso tipo intercomunicador: Do - Mi - Sol - Do agudo
        this.playBellTone(ctx, 523.25, now, 0.22, 0.28);
        this.playBellTone(ctx, 659.25, now + 0.11, 0.22, 0.3);
        this.playBellTone(ctx, 783.99, now + 0.22, 0.22, 0.32);
        this.playBellTone(ctx, 1046.5, now + 0.35, 0.55, 0.38);
      }
    }

    function normalizeRoomCode(raw) {
      if (!raw || typeof raw !== 'string') return DEFAULT_ROOM_CODE;
      const clean = raw.trim().toUpperCase();
      if (
        !clean ||
        clean === 'BULL_MARKET_KDS_LIVE_V1' ||
        clean === 'BULL_MARKET_KDS_LIVE_V2' ||
        clean === 'BULL_MARKET_KDS_LIVE_V3'

        return DEFAULT_ROOM_CODE;
      }
      return clean;
    }

    // Blindaje total: garantiza que SIEMPRE estén presentes los 10 sabores oficiales de Bull Market con sus fotos
    function ensureAllCanonicalFlavors(inputList) {
      const list = Array.isArray(inputList) ? inputList : [];
      const existingMap = new Map(list.filter(Boolean).map((f) => [f.id, f]));

      const completeFlavors = INITIAL_FLAVORS.map((base) => {
        const saved = existingMap.get(base.id);
        if (!saved) {
          return {
            ...base,
            modCount: 1,
            imageUrl: getRollImage(base),
          };
        }
        const cleanEmoji = saved.emoji && saved.emoji !== '??' ? saved.emoji : base.emoji;
        return {
          ...base,
          ...saved,
          name: base.name,
          emoji: cleanEmoji,
          modCount: saved.modCount || 1,
          imageKey: base.imageKey,
          imageUrl: getRollImage(base),
        };
      });

      // Conservar cualquier sabor extra legítimo agregado por el usuario desde Admin
      list.forEach((custom) => {
        if (
          custom &&
          custom.id &&
          custom.id !== 'flv-1' &&
          (custom.name || '').trim().toUpperCase() !== 'CHOCOAVELLANAS' &&
          !INITIAL_FLAVORS.some((b) => b.id === custom.id)
        ) {
          completeFlavors.push({
            ...custom,
            modCount: custom.modCount || 1,
            emoji: custom.emoji && custom.emoji !== '??' ? custom.emoji : '🥐',
            imageUrl: getRollImage(custom),
          });
        }
      });

      return completeFlavors;
    }

          const parsed = JSON.parse(raw);
          return ensureAllCanonicalFlavors(parsed);
        }
      } catch (e) {}
      return ensureAllCanonicalFlavors(INITIAL_FLAVORS);

    function getInitialState() {

      const currentRoom = getSavedRoomCode();

      try {
        const raw = localStorage.getItem(STORAGE_STATE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.orders)) {
            return {
              ...parsed,
              epoch: parsed.epoch || 1,
              version: parsed.version || 1,
              flavors: ensureAllCanonicalFlavors(parsed.flavors || currentFlavors),
              orders: (parsed.orders || []).map((o) => ({
                ...o,
                modCount: o.modCount || 1,
                items: (o.items || []).map((it) => ({
                  ...it,
                  imageUrl: getRollImage(it),
                })),
              })),
              announcements: Array.isArray(parsed.announcements) ? parsed.announcements : [],
              roomCode: currentRoom,
            };
          }
        }
      } catch (e) {}

      // Arranca limpio sin órdenes demo falsas para que al conectar a la sala reciba las órdenes reales en vivo

        epoch: 1,
        version: 1,
        flavors: currentFlavors,
        orders: [],
        announcements: [],
        nextTicketSeq: 1,
        lastUpdated: Date.now(),
        roomCode: currentRoom,
      };

      try {

        saveFlavors(currentFlavors);
      } catch (e) {}

      return initial;

    // ============================================================================
    // MOTOR DE SINCRONIZACIÓN CENTRALIZADA TRIPLE-REDUNDANTE (PC <-> TELÉFONO <-> TABLET)
    // 1. Cluster WebSockets MQTT en Tiempo Real (EMQX + HiveMQ con Retain=True, <60ms)
    // 2. API Serverless en el mismo dominio Vercel (/api/state)
    // 3. BroadcastChannel + localStorage para pestañas locales
    // ============================================================================
    class RealtimeSyncEngine {
      constructor() {
        this.listeners = new Set();
        this.channel = null;
        this.mqttClients = [];
        this.pollInterval = null;
        this.deviceId = 'dev_' + Math.random().toString(36).substring(2, 9);
        this.currentState = getInitialState();
        this.isConnected = false;

        if ('BroadcastChannel' in window) {
          this.channel = new BroadcastChannel(LOCAL_CHANNEL_NAME);
          this.channel.onmessage = (event) => {
            if (event.data && event.data.type === 'KDS_STATE_UPDATE') {
              if (event.data.deviceId === this.deviceId) return;
              this.handleIncomingState(event.data.state, event.data.meta);
            }
          };
        }

        window.addEventListener('storage', (e) => {
          if (e.key === STORAGE_STATE_KEY && e.newValue) {
            try {
              const newState = JSON.parse(e.newValue);
              this.handleIncomingState(newState);
            } catch (err) {}
          }
        });

        // Al desbloquear el celular o volver a la pestaña, sincronizar al instante
        if (typeof document !== 'undefined') {
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              this.forceSyncNow();
            }
          });
          window.addEventListener('focus', () => {
            this.forceSyncNow();
          });
        }

        this.initRealtimeClusterSync();
        this.initServerlessApiSync();
      }

      subscribe(listener) {
        this.listeners.add(listener);
        return () => this.listeners.delete(listener);
      }

      notify(state, meta) {
        this.currentState = state;
        this.listeners.forEach((fn) => fn(state, meta));
      }

      getMqttTopic(room) {
        const cleanRoom = normalizeRoomCode(room || this.currentState.roomCode);
        return `bullmarket/kds/v4/${cleanRoom}`;
      }

      forceSyncNow() {
        const room = normalizeRoomCode(this.currentState.roomCode);
        this.fetchFromServerlessApi(room);
      }

      handleIncomingState(incoming, meta) {
        if (!incoming) return;

        const statusWeight = { pendiente: 1, preparando: 2, despachado: 3 };
        const curEpoch = this.currentState.epoch || 1;
        const incEpoch = incoming.epoch || 1;

        // Si el mensaje viene de una época anterior (antes de "Iniciar Nuevo Día"), ignorar sus órdenes viejas
        if (incEpoch < curEpoch) {
          return;
        }

        const prevOrdersMap = new Map(
          (this.currentState.orders || []).map((o) => [o.id, o])
        );

        let mergedOrders = [];
        let newlyAddedOrders = [];
        let newlyPreparingOrders = [];
        let newlyDispatchedOrders = [];
        let hasOrderChanges = incEpoch > curEpoch;

        if (incEpoch > curEpoch) {
          // Otro dispositivo pulsó "Iniciar Nuevo Día (Limpiar Comandas)"
          mergedOrders = Array.isArray(incoming.orders) ? [...incoming.orders] : [];
          mergedOrders.forEach((inc) => {
            if (inc.status === 'pendiente' || inc.status === 'preparando') {
              newlyAddedOrders.push(inc);
            }
          });
        } else {
          // Misma época: Mezcla CRDT determinista con reloj lógico modCount por comanda
          const orderMap = new Map();
          (this.currentState.orders || []).forEach((o) => {
            if (o && o.id) orderMap.set(o.id, { ...o });
          });

          (incoming.orders || []).forEach((inc) => {
            if (!inc || !inc.id) return;
            const loc = orderMap.get(inc.id);

            if (!loc) {
              orderMap.set(inc.id, { ...inc, modCount: inc.modCount || 1 });
              hasOrderChanges = true;
              if (inc.status === 'pendiente' || inc.status === 'preparando') {
                newlyAddedOrders.push(inc);
              } else if (inc.status === 'despachado') {
                newlyDispatchedOrders.push(inc);
              }
            } else {
              const incMod = inc.modCount || 1;
              const locMod = loc.modCount || 1;

              let nextOrd = loc;
              if (incMod > locMod) {
                nextOrd = {
                  ...loc,
                  ...inc,
                  modCount: incMod,
                  startedAt: inc.startedAt || loc.startedAt,
                  dispatchedAt: inc.dispatchedAt || loc.dispatchedAt,
                  delivered: Boolean(inc.delivered ?? loc.delivered),
                };
              } else if (incMod === locMod) {
                const incW = statusWeight[inc.status] || 0;
                const locW = statusWeight[loc.status] || 0;
                const chosenStatus = incW >= locW ? inc.status : loc.status;

                const mergedItems = (loc.items || inc.items || []).map((it, idx) => {
                  const incIt = inc.items && inc.items[idx];
                  return {
                    ...it,
                    ...(incIt || {}),
                    checked: Boolean(it.checked || (incIt && incIt.checked)),
                  };
                });

                nextOrd = {
                  ...loc,
                  ...inc,
                  status: chosenStatus,
                  items: mergedItems,
                  startedAt: loc.startedAt || inc.startedAt,
                  dispatchedAt: loc.dispatchedAt || inc.dispatchedAt,
                  delivered: Boolean(loc.delivered || inc.delivered),
                };
              }

              // Detectar si cambió estado o checks respecto a lo que teníamos localmente
              const prevCheckedCount = (loc.items || []).filter((i) => i.checked).length;
              const nextCheckedCount = (nextOrd.items || []).filter((i) => i.checked).length;

              if (
                nextOrd.status !== loc.status ||
                nextCheckedCount !== prevCheckedCount ||
                Boolean(nextOrd.delivered) !== Boolean(loc.delivered) ||
                nextOrd.modCount !== loc.modCount
              ) {
                hasOrderChanges = true;
              }

              if (loc.status !== 'preparando' && nextOrd.status === 'preparando') {
                newlyPreparingOrders.push(nextOrd);
              }
              if (loc.status !== 'despachado' && nextOrd.status === 'despachado') {
                newlyDispatchedOrders.push(nextOrd);
              }

              orderMap.set(inc.id, nextOrd);
            }
          });

          mergedOrders = Array.from(orderMap.values()).sort(
            (a, b) => (a.createdAt || 0) - (b.createdAt || 0)
          );
        }

        // Rehidratar órdenes con fotos Base64 locales
        const hydratedOrders = mergedOrders.map((o) => ({
          ...o,
          items: (o.items || []).map((it) => ({
            ...it,
            imageUrl: getRollImage(it),
          })),
        }));

        // 2. REHIDRATAR Y UNIR SABORES (Respetando modCount para cambios de Agotado 86)
        const baseList = ensureAllCanonicalFlavors(this.currentState.flavors);
        const incomingMap = new Map(
          (Array.isArray(incoming.flavors) ? incoming.flavors : [])
            .filter(Boolean)
            .map((f) => [f.id, f])
        );

        let hasFlavorChanges = false;
        const combinedList = baseList.map((f) => {
          const incFlv = incomingMap.get(f.id);
          if (!incFlv) return f;
          const incMod = incFlv.modCount || 1;
          const locMod = f.modCount || 1;
          if (incMod > locMod || (incMod === locMod && incFlv.available !== f.available)) {
            if (incFlv.available !== f.available) hasFlavorChanges = true;
            return {
              ...f,
              ...incFlv,
              modCount: Math.max(incMod, locMod),
              available: typeof incFlv.available === 'boolean' ? incFlv.available : f.available,
            };
          }
          return f;
        });

        if (Array.isArray(incoming.flavors)) {
          incoming.flavors.forEach((incFlv) => {
            if (incFlv && incFlv.id && !combinedList.some((c) => c.id === incFlv.id)) {
              combinedList.push(incFlv);
              hasFlavorChanges = true;
            }
          });
        }

        const mergedFlavors = ensureAllCanonicalFlavors(combinedList);
        saveFlavors(mergedFlavors);

        // 3. MEZCLAR ANUNCIOS DE PRODUCCIÓN Y AVISOS DE PANADERÍA A BARRA (Respetando modCount para cambios de cantidad en vivo)
        const incomingAnnouncements = Array.isArray(incoming.announcements)
          ? incoming.announcements
          : [];
        const localAnnouncements = Array.isArray(this.currentState.announcements)
          ? this.currentState.announcements
          : [];
        const localAnnIds = new Set(localAnnouncements.map((a) => a && a.id));

        let hasAnnouncementChanges = false;
        const annMap = new Map();
        localAnnouncements.forEach((a) => {
          if (a && a.id) annMap.set(a.id, a);
        });
        incomingAnnouncements.forEach((incA) => {
          if (!incA || !incA.id) return;
          const locA = annMap.get(incA.id);
          if (!locA) {
            annMap.set(incA.id, incA);
            hasAnnouncementChanges = true;
          } else {
            const incMod = incA.modCount || 1;
            const locMod = locA.modCount || 1;
            if (
              incMod > locMod ||
              (incMod === locMod && (incA.quantity !== locA.quantity || incA.text !== locA.text))
            ) {
              annMap.set(incA.id, { ...locA, ...incA, modCount: Math.max(incMod, locMod) });
              hasAnnouncementChanges = true;
            }
          }
        });
        const mergedAnnouncements = Array.from(annMap.values())
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
          .slice(0, 15);

        const newestIncomingAnn = incomingAnnouncements[0];
        const isNewAnnouncement = Boolean(
          newestIncomingAnn &&
            !localAnnIds.has(newestIncomingAnn.id) &&
            Date.now() - (newestIncomingAnn.createdAt || 0) < 120000
        );

        const maxTicketNum = hydratedOrders.reduce((max, o) => {
          const m = String(o.ticketNumber || '').match(/\d+/);
          return m ? Math.max(max, parseInt(m[0], 10)) : max;
        }, 0);

        const nextSeq =
          incEpoch > curEpoch
            ? Math.max(incoming.nextTicketSeq || 1, maxTicketNum + 1)
            : Math.max(
                this.currentState.nextTicketSeq || 1,
                incoming.nextTicketSeq || 1,
                maxTicketNum + 1
              );

        if (
          !hasOrderChanges &&
          !hasFlavorChanges &&
          !hasAnnouncementChanges &&
          !isNewAnnouncement &&
          nextSeq === this.currentState.nextTicketSeq &&
          mergedAnnouncements.length === localAnnouncements.length
        ) {
          return;
        }

        const hydratedState = {
          epoch: Math.max(curEpoch, incEpoch),
          version: Math.max(this.currentState.version || 0, incoming.version || 0) + 1,
          flavors: mergedFlavors,
          orders: hydratedOrders,
          announcements: mergedAnnouncements,
          nextTicketSeq: nextSeq,
          lastUpdated: Date.now(),
          roomCode: normalizeRoomCode(this.currentState.roomCode),
        };

        try {
          localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(hydratedState));
        } catch (e) {}

        this.notify(hydratedState, {
          isNewOrder: newlyAddedOrders.length > 0,
          newOrder: newlyAddedOrders[newlyAddedOrders.length - 1] || null,
          isOrderPreparing: newlyPreparingOrders.length > 0,
          preparingOrder: newlyPreparingOrders[newlyPreparingOrders.length - 1] || null,
          isOrderReady: newlyDispatchedOrders.length > 0,
          readyOrder: newlyDispatchedOrders[newlyDispatchedOrders.length - 1] || null,
          isNewAnnouncement,
          announcement: isNewAnnouncement ? newestIncomingAnn : null,
        });
      }

      buildLeanState(state) {
        const completeFlavors = ensureAllCanonicalFlavors(state.flavors);
        const leanFlavors = completeFlavors.map((f) => {
          const base = INITIAL_FLAVORS.find((b) => b.id === f.id);
          return {
            id: f.id,
            name: base?.name || f.name,
            shortCode: f.shortCode,
            color: f.color,
            available: f.available,
            modCount: f.modCount || 1,
            emoji: f.emoji && f.emoji !== '??' ? f.emoji : base?.emoji || '🥐',
            imageKey: f.imageKey || base?.imageKey || '',
          };
        });

        const activeOrders = (state.orders || []).filter((o) => o.status !== 'despachado');
        const recentDispatched = (state.orders || [])
          .filter((o) => o.status === 'despachado')
          .slice(-20);

        const leanOrders = [...activeOrders, ...recentDispatched].map((o) => ({
          id: o.id,
          ticketNumber: o.ticketNumber,
          customerOrTable: o.customerOrTable,
          orderType: o.orderType,
          note: o.note,
          status: o.status,
          modCount: o.modCount || 1,
          delivered: Boolean(o.delivered),
          createdAt: o.createdAt,
          startedAt: o.startedAt,
          dispatchedAt: o.dispatchedAt,
          items: (o.items || []).map((it) => ({
            flavorId: it.flavorId,
            flavorName: it.flavorName,
            quantity: it.quantity,
            checked: Boolean(it.checked),
            color: it.color,
          })),
        }));

        return {
          epoch: state.epoch || 1,
          version: state.version || 1,
          roomCode: normalizeRoomCode(state.roomCode),
          lastUpdated: state.lastUpdated || Date.now(),
          nextTicketSeq: state.nextTicketSeq || 1,
          flavors: leanFlavors,
          orders: leanOrders,
          announcements: (state.announcements || []).slice(0, 8),
        };
      }

      publishState(nextState, meta) {
        const safeFlavors = ensureAllCanonicalFlavors(nextState.flavors);
        const stamped = {
          ...nextState,
          epoch: nextState.epoch || this.currentState.epoch || 1,
          roomCode: normalizeRoomCode(nextState.roomCode || this.currentState.roomCode),
          flavors: safeFlavors,
          version: (this.currentState.version || 0) + 1,
          lastUpdated: Date.now(),
        };
        this.currentState = stamped;
        saveFlavors(safeFlavors);

        try {
          localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(stamped));
        } catch (e) {}

        if (this.channel) {
          this.channel.postMessage({
            type: 'KDS_STATE_UPDATE',
            state: stamped,
            meta,
            deviceId: this.deviceId,
          });
        }

        this.notify(stamped, meta);
        this.broadcastToCluster(stamped, meta);
      }

      // 1. CLUSTER WEBSOCKETS MQTT (EMQX + HiveMQ con Retain=True para sincronización en <60ms)
      initRealtimeClusterSync() {
        if (this.mqttClients && this.mqttClients.length > 0) {
          this.mqttClients.forEach((c) => {
            try {
              c.end(true);
            } catch (e) {}
          });
          this.mqttClients = [];
        }

        if (typeof window === 'undefined' || !window.mqtt) return;

        const room = normalizeRoomCode(this.currentState.roomCode);
        const topic = this.getMqttTopic(room);
        const brokers = [
          'wss://broker.emqx.io:8084/mqtt',
          'wss://broker.hivemq.com:8884/mqtt',
        ];

        brokers.forEach((brokerUrl, idx) => {
          try {
            const client = window.mqtt.connect(brokerUrl, {
              clientId: `bm_${this.deviceId}_${idx}_${Math.random().toString(16).slice(2, 6)}`,
              clean: true,
              connectTimeout: 5000,
              reconnectPeriod: 2000,
              keepalive: 30,
            });

            client.on('connect', () => {
              this.isConnected = true;
              client.subscribe(topic, { qos: 1 }, (err) => {
                if (!err && this.currentState.orders.length > 0) {
                  // Si este dispositivo ya tiene pedidos activos, compartirlos con la sala
                  const lean = this.buildLeanState(this.currentState);
                  client.publish(
                    topic,
                    JSON.stringify({
                      deviceId: this.deviceId,
                      state: lean,
                      meta: { action: 'hello_sync' },
                    }),
                    { qos: 1, retain: true }
                  );
                }
              });
            });

            client.on('message', (receivedTopic, messageBuffer) => {
              if (receivedTopic !== topic) return;
              try {
                const rawStr = messageBuffer.toString();
                if (!rawStr || !rawStr.startsWith('{')) return;
                const parsed = JSON.parse(rawStr);
                if (parsed && parsed.state) {
                  this.handleIncomingState(parsed.state, parsed.meta);
                }
              } catch (err) {}
            });

            this.mqttClients.push(client);
          } catch (err) {}
        });
      }

      // 2. API SERVERLESS VERCEL (/api/state) + SERVIDOR LOCAL
      initServerlessApiSync() {
        if (this.pollInterval) {
          clearInterval(this.pollInterval);
          this.pollInterval = null;
        }

        const room = normalizeRoomCode(this.currentState.roomCode);
        this.fetchFromServerlessApi(room);

        this.pollInterval = setInterval(() => {
          const activeRoom = normalizeRoomCode(this.currentState.roomCode);
          this.fetchFromServerlessApi(activeRoom);
        }, 2000);
      }

      async fetchFromServerlessApi(room) {
        if (
          typeof window === 'undefined' ||
          !window.location ||
          !window.location.protocol.startsWith('http')
        ) {
          return;
        }
        try {
          const res = await fetch(
            `/api/state?room=${encodeURIComponent(room)}&t=${Date.now()}`,
            {
              method: 'GET',
              headers: { 'Cache-Control': 'no-cache' },
            }
          );
          if (res.ok) {
            const data = await res.json();
            if (data && data.state) {
              this.handleIncomingState(data.state, data.meta);
            } else if (data && data.ok && !data.state && this.currentState.orders.length > 0) {
              // El servidor recién despertó vacío y nosotros tenemos comandas activas: subirlas
              this.postToServerlessApi(this.currentState, { action: 'seed_server' });
            }
          }
        } catch (err) {}
      }

      async postToServerlessApi(state, meta) {
        if (
          typeof window === 'undefined' ||
          !window.location ||
          !window.location.protocol.startsWith('http')
        ) {
          return;
        }
        try {
          const room = normalizeRoomCode(state.roomCode);
          const leanState = this.buildLeanState(state);
          const res = await fetch(`/api/state?room=${encodeURIComponent(room)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deviceId: this.deviceId,
              state: leanState,
              meta,
            }),
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.state) {
              this.handleIncomingState(data.state, data.meta);
            }
          }
        } catch (err) {}
      }

      broadcastToCluster(state, meta) {
        const room = normalizeRoomCode(state.roomCode);
        const topic = this.getMqttTopic(room);
        const leanState = this.buildLeanState(state);
        const payload = JSON.stringify({
          deviceId: this.deviceId,
          state: leanState,
          meta,
        });

        // Publicar por WebSockets MQTT (con retain: true para que cualquier dispositivo nuevo reciba la foto actual al entrar)
        if (this.mqttClients && this.mqttClients.length > 0) {
          this.mqttClients.forEach((client) => {
            try {
              if (client && client.connected) {
                client.publish(topic, payload, { qos: 1, retain: true });
              }
            } catch (e) {}
          });
        }

        // Publicar a /api/state en Vercel / servidor local
        this.postToServerlessApi(state, meta);
      }

      setRoomCode(newRoom) {
        const clean = normalizeRoomCode(newRoom);
        try {
          localStorage.setItem(STORAGE_ROOM_KEY, clean);
        } catch (e) {}

        const next = { ...this.currentState, roomCode: clean, lastUpdated: Date.now() };
        this.publishState(next);
        this.initRealtimeClusterSync();
        this.initServerlessApiSync();
      }
    }

    const syncEngine = new RealtimeSyncEngine();

    // ============================================================================
    // 4. VISTA 1: EMISOR DE BARRA / MESEROS / CAJA (/barra) + SEGUIMIENTO EN VIVO
    // ============================================================================
    function BarraView({
      flavors,
      orders,
      nextTicketSeq,
      announcements = [],
      onCreateOrder,
      onToggleOrderDelivered,
      onUpdateAnnouncementQuantity,
    }) {
      const maxExistingNum = orders.reduce((max, o) => {
        const m = String(o.ticketNumber || '').match(/\d+/);
        return m ? Math.max(max, parseInt(m[0], 10)) : max;
      }, 0);
      const effectiveSeq = Math.max(nextTicketSeq || 1, maxExistingNum + 1);
      const formattedSeq = `#${String(effectiveSeq).padStart(3, '0')}`;

      const [customTicket, setCustomTicket] = useState('');
      const [customerOrTable, setCustomerOrTable] = useState('');
      const [orderType, setOrderType] = useState('comer_aqui');
      const [note, setNote] = useState('');
      const [cart, setCart] = useState({});
      const [flashSuccess, setFlashSuccess] = useState(null);
      const [dismissedAnnId, setDismissedAnnId] = useState(null);
      const [trackingFilter, setTrackingFilter] = useState('todos'); // 'todos' | 'cocina' | 'salieron'
      const [now, setNow] = useState(Date.now());

      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(t);
      }, []);

      const handleTapFlavor = (flavor) => {
        if (!flavor.available) {
          soundEngine.play86Alert();
          return;
        }
        soundEngine.playTapSound(520);
        setCart((prev) => ({
          ...prev,
          [flavor.id]: (prev[flavor.id] || 0) + 1,
        }));
      };

      const handleAdjustQuantity = (e, flavor, delta) => {
        e.stopPropagation();
        if (!flavor.available && delta > 0) {
          soundEngine.play86Alert();
          return;
        }
        soundEngine.playTapSound(delta > 0 ? 580 : 380);
        setCart((prev) => {
          const nextQty = (prev[flavor.id] || 0) + delta;
          if (nextQty <= 0) {
            const copy = { ...prev };
            delete copy[flavor.id];
            return copy;
          }
          return { ...prev, [flavor.id]: nextQty };
        });
      };

      const toggleQuickNote = (chip) => {
        soundEngine.playTapSound(460);
        setNote((prev) => {
          const parts = prev
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
          if (parts.includes(chip)) {
            return parts.filter((p) => p !== chip).join(', ');
          }
          return [...parts, chip].join(', ');
        });
      };

      const totalUnits = Object.values(cart).reduce((acc, q) => acc + q, 0);

      const handleSubmitOrder = () => {
        if (totalUnits === 0) return;
        const items = flavors
          .filter((f) => (cart[f.id] || 0) > 0)
          .map((f) => ({
            flavorId: f.id,
            flavorName: f.name,
            color: f.color,
            emoji: f.emoji,
            imageKey: f.imageKey,
            imageUrl: f.imageUrl,
            quantity: cart[f.id],
            checked: false,
          }));

        const finalTicket = customTicket.trim() || formattedSeq;

        onCreateOrder({
          ticketNumber: finalTicket,
          customerOrTable: customerOrTable.trim() || 'Barra Directa',
          orderType,
          note: note.trim(),
          items,
        });

        soundEngine.playTapSound(740);
        setFlashSuccess(`✅ Comanda ${finalTicket} enviada en vivo a Panadería (${totalUnits} uds)`);
        setTimeout(() => setFlashSuccess(null), 2800);

        setCart({});
        setCustomTicket('');
        setCustomerOrTable('');
        setNote('');
      };

      const sortedOrders = [...orders].sort((a, b) => b.createdAt - a.createdAt);
      const inKitchenOrders = sortedOrders.filter(
        (o) => o.status === 'pendiente' || o.status === 'preparando'
      );
      const readyOrders = sortedOrders.filter((o) => o.status === 'despachado');
      const undeliveredReadyCount = readyOrders.filter((o) => !o.delivered).length;

      const displayedOrders =
        trackingFilter === 'cocina'
          ? inKitchenOrders
          : trackingFilter === 'salieron'
          ? readyOrders
          : sortedOrders.slice(0, 20);

      const formatElapsed = (timestamp) => {
        const diffSec = Math.max(0, Math.floor((now - timestamp) / 1000));
        const mins = Math.floor(diffSec / 60);
        const secs = diffSec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const activeAnn = (announcements || []).find(
        (a) => a && a.id !== dismissedAnnId && now - a.createdAt < 20 * 60 * 1000
      );

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 p-3 md:p-5 max-w-[1680px] mx-auto">
          {/* COLUMNA IZQUIERDA: TECLADO DE SABORES Y DATOS DEL PEDIDO */}
          <div className="lg:col-span-7 xl:col-span-8 flex flex-col gap-4">
            {/* MARQUESINA / BANNER EN VIVO DE PANADERÍA */}
            {activeAnn && (
              <div

                            <span className="text-xs font-black text-white truncate max-w-[130px]">
                              {ord.customerOrTable}
                            </span>
                            <span className="text-[10px] font-black bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md shrink-0">
                              {count} uds
                            </span>
                          </div>

                          {ord.status === 'pendiente' && (
                            <span className="text-[11px] font-black px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 shrink-0">
                              ⏳ En Cola ({formatElapsed(ord.createdAt)})
                            </span>
                          )}
                          {ord.status === 'preparando' && (
                            <span className="text-[11px] font-black px-2.5 py-1 rounded-full bg-sky-500/25 text-sky-200 border border-sky-400 animate-pulse shrink-0">
                              🧑‍🍳 Preparando ({checkedUnits}/{count})
                            </span>
                          )}
                          {ord.status === 'despachado' && (
                            <span
                              className={`text-[11px] font-black px-2.5 py-1 rounded-full shrink-0 ${
                                ord.delivered
                                  ? 'bg-slate-800 text-slate-400 border border-slate-700'
                                  : 'bg-emerald-500 text-slate-950 shadow-md'
                              }`}
                            >
                              {ord.delivered ? '🙌 Entregado' : '✅ ¡SALIÓ / LISTO!'}
                            </span>
                          )}
                        </div>

                        {/* Barra de progreso de bandeja cuando está en cocina */}
                        {(ord.status === 'pendiente' || ord.status === 'preparando') && (
                          <div className="mt-2">
                            <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                              <span>Avance en bandeja de Panadería:</span>
                              <span className="text-emerald-400 font-black">
                                {checkedUnits}/{count} listos ({pct}%)
                              </span>
                            </div>
                            <div className="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                              <div
                                className="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-300"
                                style={{ width: `${pct}%` }}
                              />
                            </div>
                          </div>
                        )}

                        <div className="flex flex-wrap gap-1.5 mt-2.5">
                          {ord.items.map((item) => (
                            <span
                              key={item.flavorId}
                              className={`inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-md border ${
                                item.checked || ord.status === 'despachado'
                                  ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300'
                                  : 'bg-slate-900 border-slate-700 text-slate-200'
                              }`}
                            >
                              <span>{item.checked || ord.status === 'despachado' ? '✓' : '⏳'}</span>
                              <span>
                                {item.quantity}x {item.flavorName}
                              </span>
                            </span>
                          ))}
                        </div>

                        {ord.status === 'despachado' && onToggleOrderDelivered && (
                          <div className="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between">
                            <span className="text-[10px] font-bold text-emerald-300/80">
                              Salió a las{' '}
                              {new Date(ord.dispatchedAt || ord.createdAt).toLocaleTimeString([], {
                                hour: '2-digit',
                                minute: '2-digit',
                              })}
                            </span>
                            <button
                              type="button"
                              onClick={() => {
                                soundEngine.playTapSound(520);
                                onToggleOrderDelivered(ord.id);
                              }}
                              className={`px-3 py-1 rounded-lg text-[11px] font-black uppercase transition-all ${
                                ord.delivered
                                  ? 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                                  : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow'
                              }`}
                            >
                              {ord.delivered
                                ? '↩️ Desmarcar Entrega'
                                : '🙌 Marcar Entregado a Cliente'}
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Últimas tandas anunciadas por Panadería */}
              {announcements && announcements.length > 0 && (
                <div className="mt-4 pt-3 border-t border-slate-800">
                  <span className="block text-[10px] font-black uppercase tracking-wider text-amber-400 mb-2">
                    📢 Últimos Avisos de Producción (Panadería):
                  </span>
                  <div className="space-y-1.5 max-h-[145px] overflow-y-auto">
                    {announcements.slice(0, 4).map((a) => (
                      <div
                        key={a.id}
                        className="text-[11px] font-bold bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 flex items-center justify-between gap-2 text-slate-200"
                      >
                        <div className="min-w-0 flex-1">
                          {(a.isCustomizableFlavor || a.flavorId === 'SIN_SABOR') && (
                            <span className="inline-block mr-1.5 text-[9px] font-black uppercase px-1.5 py-0.2 rounded bg-emerald-500 text-slate-950">
                              🎨 Sabor Modificable
                            </span>
                          )}
                          <span className="truncate">{a.text}</span>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                          {typeof a.quantity === 'number' && onUpdateAnnouncementQuantity && (
                            <div className="flex items-center gap-1 bg-slate-900 border border-slate-700 rounded-md px-1 py-0.5">
                              <button
                                type="button"
                                onClick={() => {
                                  soundEngine.playTapSound(380);
                                  onUpdateAnnouncementQuantity(a.id, Math.max(0, (a.quantity || 0) - 1));
                                }}
                                className="w-5 h-5 rounded bg-slate-800 hover:bg-slate-700 text-white font-black text-xs flex items-center justify-center"
                                title="Restar 1"
                              >
                                −
                              </button>
                              <span className="text-[11px] font-black text-amber-400 px-1 tabular-nums">
                                {a.quantity}
                              </span>
                              <button
                                type="button"
                                onClick={() => {
                                  soundEngine.playTapSound(580);
                                  onUpdateAnnouncementQuantity(a.id, (a.quantity || 0) + 1);
                                }}
                                className="w-5 h-5 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center"
                                title="Sumar 1"
                              >
                                +
                              </button>
                            </div>
                          )}
                          <span className="text-[10px] text-slate-400">
                            {new Date(a.createdAt).toLocaleTimeString([], {
                              hour: '2-digit',
                              minute: '2-digit',
                            })}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 5. VISTA 2: PANTALLA KDS DE PANADERÍA (/panaderia)
    // ============================================================================
    function PanaderiaView({
      flavors,
      orders,
      announcements = [],
      onUpdateOrderStatus,
      onToggleOrderItemCheck,
      onToggleFlavorAvailability,
      onCreateAnnouncement,
      onUpdateAnnouncementQuantity,
    }) {
      const [now, setNow] = useState(Date.now());
      const [discountCheckedItems, setDiscountCheckedItems] = useState(false);
      const [showRecentlyDispatched, setShowRecentlyDispatched] = useState(false);

      // Estado para avisos y tandas de producción a Barra
      // 'SIN_SABOR' permite avisar a Mesa, Caja y Barra que salió una tanda base cuyo sabor se puede modificar
      const [showBroadcastModal, setShowBroadcastModal] = useState(false);
      const [broadcastTab, setBroadcastTab] = useState('tanda'); // 'tanda' | 'horno' | '86' | 'mensaje'
      const [selectedFlavorId, setSelectedFlavorId] = useState('SIN_SABOR');
      const [batchQty, setBatchQty] = useState(12);
      const [ovenMinutes, setOvenMinutes] = useState(10);
      const [customMsg, setCustomMsg] = useState('');
      const [broadcastToast, setBroadcastToast] = useState(null);

      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(t);
      }, []);

      const handleSendBatchReady = () => {
        const safeQty = Math.max(1, parseInt(batchQty, 10) || 1);
        const isSinSabor = selectedFlavorId === 'SIN_SABOR';
        const flv = isSinSabor
          ? { id: 'SIN_SABOR', name: 'SIN SABOR (Sabor Modificable)' }
          : flavors.find((f) => f.id === selectedFlavorId) || flavors[0];

        if (onCreateAnnouncement) {
          onCreateAnnouncement({
            type: 'batch_ready',
            flavorId: flv.id,
            flavorName: flv.name,
            isCustomizableFlavor: isSinSabor,
            quantity: safeQty,
            initialQuantity: safeQty,
            modCount: 1,
            text: isSinSabor
              ? `🔥 ¡TANDA SIN SABOR LISTA! Salieron ${safeQty} rolls base — SE PUEDE MODIFICAR EL SABOR`
              : `🔥 ¡TANDA LISTA! Salieron ${safeQty} rolls de ${flv.name} recién horneados`,
          });
        }
        setBroadcastToast(
          isSinSabor
            ? `✅ Aviso enviado: Salieron ${safeQty} rolls SIN SABOR (Sabor Modificable)`
            : `✅ Aviso enviado: Salieron ${safeQty} rolls de ${flv.name}`
        );
        setTimeout(() => setBroadcastToast(null), 3500);
        setShowBroadcastModal(false);
      };

      const handleSendInOven = () => {
        const safeQty = Math.max(1, parseInt(batchQty, 10) || 1);
        const isSinSabor = selectedFlavorId === 'SIN_SABOR';
        const flv = isSinSabor
          ? { id: 'SIN_SABOR', name: 'SIN SABOR (Sabor Modificable)' }
          : flavors.find((f) => f.id === selectedFlavorId) || flavors[0];

        if (onCreateAnnouncement) {
          onCreateAnnouncement({
            type: 'in_oven',
            flavorId: flv.id,
            flavorName: flv.name,
            isCustomizableFlavor: isSinSabor,
            quantity: safeQty,
            initialQuantity: safeQty,
            minutes: ovenMinutes,
            modCount: 1,
            text: isSinSabor
              ? `⏳ EN HORNO: Próxima tanda de ${safeQty} rolls SIN SABOR (Sabor Modificable) lista en ${ovenMinutes} min`
              : `⏳ EN HORNO: Próxima tanda de ${safeQty} rolls de ${flv.name} lista en ${ovenMinutes} min`,
          });
        }
        setBroadcastToast(
          isSinSabor
            ? `✅ Aviso enviado: ${safeQty} rolls SIN SABOR en horno (${ovenMinutes} min)`
            : `✅ Aviso enviado: ${safeQty} rolls de ${flv.name} en horno (${ovenMinutes} min)`
        );
        setTimeout(() => setBroadcastToast(null), 3500);
        setShowBroadcastModal(false);
      };

      const handleSendCustomMessage = (textToSend) => {
        const finalMsg = textToSend || customMsg;
        if (!finalMsg.trim()) return;
        if (onCreateAnnouncement) {
          onCreateAnnouncement({
            type: 'quick_message',
            text: `📢 MENSAJE DE COCINA: ${finalMsg.trim()}`,
          });
        }
        setBroadcastToast(`✅ Mensaje enviado a Barra`);
        setTimeout(() => setBroadcastToast(null), 3500);
        setCustomMsg('');
        setShowBroadcastModal(false);
      };

      const activeOrders = [...orders]
        .filter((o) => o.status === 'pendiente' || o.status === 'preparando')
        .sort((a, b) => a.createdAt - b.createdAt);

      const dispatchedOrders = [...orders]
        .filter((o) => o.status === 'despachado')
        .sort((a, b) => (b.dispatchedAt || b.createdAt) - (a.dispatchedAt || a.createdAt))
        .slice(0, 8);

      const batchTotals = flavors.map((flavor) => {
        let totalInActiveOrders = 0;
        let totalUnchecked = 0;
        activeOrders.forEach((ord) => {
          ord.items.forEach((item) => {
            if (item.flavorId === flavor.id) {
              totalInActiveOrders += item.quantity;
              if (!item.checked) totalUnchecked += item.quantity;
            }
          });
        });
        const displayedCount = discountCheckedItems ? totalUnchecked : totalInActiveOrders;
        const checkedInTray = totalInActiveOrders - totalUnchecked;
        return { flavor, displayedCount, totalInActiveOrders, checkedInTray };
      });

      const totalPendingUnits = batchTotals.reduce((acc, b) => acc + b.displayedCount, 0);

      const getUrgencyLevel = (createdAt) => {
        const elapsedMinutes = (now - createdAt) / 60000;
        if (elapsedMinutes < 3) return 'green';
        if (elapsedMinutes <= 6) return 'yellow';
        return 'red';
      };

      const formatTimer = (createdAt) => {
        const diffSec = Math.max(0, Math.floor((now - createdAt) / 1000));
        const mins = Math.floor(diffSec / 60);
        const secs = diffSec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const formatTimeOfDay = (timestamp) => {
        return new Date(timestamp).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      };

      return (
        <div className="flex flex-col min-h-[calc(100vh-64px)] bg-slate-950 text-white">
          {/* PANEL SUPERIOR FIJO: PRODUCCIÓN EN LOTE CON FOTOS REALES */}
          <section className="sticky top-[64px] z-30 bg-slate-950/95 backdrop-blur-md border-b-2 border-slate-800 px-3 py-3 md:px-6 md:py-3.5 shadow-2xl">
            <div className="max-w-[1800px] mx-auto">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                <div className="flex items-center gap-2.5">
                  <span className="text-xl">🔥</span>
                  <h2 className="text-sm md:text-base font-black uppercase tracking-wider text-white flex items-center gap-2">
                    Consolidado en Vivo por Sabor (Producción en Lote)
                    <span className="bg-amber-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full tabular-nums">
                      {totalPendingUnits} UDS PENDIENTES
                    </span>
                  </h2>
                </div>

                <div className="flex items-center gap-2 text-xs">
                  <button
                    type="button"
                    onClick={() => {
                      soundEngine.playTapSound(460);
                      setDiscountCheckedItems((p) => !p);
                    }}
                    className={`px-3 py-1.5 rounded-xl font-bold border transition-all ${
                      discountCheckedItems
                        ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300'
                        : 'bg-slate-900 border-slate-700 text-slate-300 hover:text-white'
                    }`}
                  >
                    {discountCheckedItems
                      ? '☑️ Descontando al tachar en bandeja'
                      : '📦 Descontar al despachar comanda'}
                  </button>

                  <button
                    type="button"
                    onClick={() => setShowRecentlyDispatched((p) => !p)}
                    className="px-3 py-1.5 rounded-xl font-bold bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300"
                  >
                    ↩️ Historial ({dispatchedOrders.length})
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      soundEngine.playTapSound(520);
                      setShowBroadcastModal(true);
                    }}
                    className="px-3.5 py-1.5 rounded-xl font-black bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 shadow-lg shadow-orange-500/25 flex items-center gap-1.5 transition-all active:scale-95 animate-pulse"
                  >
                    <span>📢 Avisar a Barra</span>
                  </button>
                </div>
              </div>

              {broadcastToast && (
                <div className="mb-2 bg-emerald-500/20 border border-emerald-400 text-emerald-200 px-3.5 py-2 rounded-xl text-xs font-black flex items-center justify-between animate-bounce">
                  <span>{broadcastToast}</span>
                  <span className="text-[10px] uppercase tracking-wider text-emerald-400">Enviado a Barra</span>
                </div>
              )}

              {/* Grid de 10 Sabores */}
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5">
                {batchTotals.map(({ flavor, displayedCount, checkedInTray }) => {
                  const palette = COLOR_PALETTE[flavor.color] || COLOR_PALETTE.amber;
                  const hasPending = displayedCount > 0;
                  const imgSrc = getRollImage(flavor);

                  return (
                    <div
                      key={flavor.id}
                      className={`relative rounded-2xl border-2 px-3 py-2 flex items-center justify-between transition-all ${
                        !flavor.available
                          ? 'bg-rose-950/30 border-rose-600/60 opacity-75'
                          : hasPending
                          ? `bg-[#4a2e1b] ${palette.border} shadow-lg ${palette.glow}`
                          : 'bg-slate-900/60 border-slate-800/80 opacity-60'
                      }`}
                    >
                      <div className="flex items-center gap-2.5 min-w-0 pr-1.5">
                        {imgSrc ? (
                          <img
                            src={imgSrc}
                            alt={flavor.name}
                            className="w-11 h-11 rounded-full object-cover border border-amber-400/60 shrink-0 shadow"
                          />
                        ) : (
                          <span className="text-2xl">{flavor.emoji}</span>
                        )}
                        <div className="min-w-0">
                          <p className="text-xs font-black text-white uppercase leading-tight truncate">
                            {flavor.name}
                          </p>
                          <div className="flex items-center gap-1 mt-0.5">
                            <button
                              type="button"
                              onClick={() => {
                                soundEngine.play86Alert();
                                onToggleFlavorAvailability(flavor.id);
                              }}
                              className={`text-[9px] font-black px-1.5 py-0.5 rounded border ${
                                flavor.available
                                  ? 'bg-slate-950/70 border-slate-700 text-slate-400 hover:text-rose-400'
                                  : 'bg-rose-600 border-rose-400 text-white'
                              }`}
                            >
                              {flavor.available ? '86' : 'AGOTADO'}
                            </button>
                            {checkedInTray > 0 && (
                              <span className="text-[10px] font-bold text-emerald-300 truncate">
                                ✓{checkedInTray}
                              </span>
                            )}
                          </div>
                        </div>
                      </div>

                      <div
                        className={`shrink-0 min-w-[46px] h-11 px-2 rounded-xl flex items-center justify-center text-2xl font-black tabular-nums shadow-inner ${
                          hasPending
                            ? palette.badgeBg
                            : 'bg-slate-950 text-slate-600 border border-slate-800'
                        }`}
                      >
                        {displayedCount}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {showRecentlyDispatched && (
            <div className="bg-slate-900 border-b border-slate-800 px-4 py-3">
              <div className="max-w-[1800px] mx-auto">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-extrabold uppercase text-sky-400">
                    ↩️ Últimas Comandas Despachadas
                  </span>
                  <button
                    type="button"
                    onClick={() => setShowRecentlyDispatched(false)}
                    className="text-xs text-slate-400 hover:text-white font-bold"
                  >
                    Cerrar ✕
                  </button>
                </div>
                <div className="flex flex-wrap gap-2">
                  {dispatchedOrders.map((ord) => (
                    <div
                      key={ord.id}
                      className="flex items-center gap-2.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5"
                    >
                      <span className="font-black text-sm text-emerald-400">
                        {ord.ticketNumber}
                      </span>
                      <span className="text-xs text-slate-300">{ord.customerOrTable}</span>
                      <button
                        type="button"
                        onClick={() => {
                          soundEngine.playTapSound(500);
                          onUpdateOrderStatus(ord.id, 'preparando');
                        }}
                        className="text-xs font-bold bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/40 px-2 py-0.5 rounded-lg"
                      >
                        Recuperar
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* PANEL PRINCIPAL: COLA FIFO */}
          <main className="flex-1 p-3 md:p-6 max-w-[1800px] w-full mx-auto">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h3 className="text-base md:text-lg font-black uppercase tracking-wide text-white">
                  📋 Cola de Comandas en Orden de Llegada (FIFO: {activeOrders.length} activas)
                </h3>
              </div>

              <div className="flex items-center gap-2.5 text-xs font-bold">
                <span className="inline-flex items-center gap-1.5 text-emerald-400 bg-emerald-950/60 border border-emerald-500/40 px-2.5 py-1 rounded-full">
                  🟢 &lt; 3 min
                </span>
                <span className="inline-flex items-center gap-1.5 text-amber-300 bg-amber-950/60 border border-amber-500/40 px-2.5 py-1 rounded-full">
                  🟡 3 - 6 min
                </span>
                <span className="inline-flex items-center gap-1.5 text-rose-300 bg-rose-950/60 border border-rose-500/40 px-2.5 py-1 rounded-full animate-pulse">
                  🔴 &gt; 6 min
                </span>
              </div>
            </div>

            {activeOrders.length === 0 ? (
              <div className="border-2 border-dashed border-slate-800 rounded-3xl p-12 text-center my-6 bg-slate-900/30">
                <div className="text-5xl mb-3">✅</div>
                <h4 className="text-2xl font-black text-white">
                  ¡Sin comandas pendientes en Panadería!
                </h4>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {activeOrders.map((order, fifoIndex) => {
                  const urgency = getUrgencyLevel(order.createdAt);
                  const totalOrderUnits = order.items.reduce((s, i) => s + i.quantity, 0);
                  const checkedUnits = order.items.reduce(
                    (s, i) => s + (i.checked ? i.quantity : 0),
                    0
                  );
                  const progressPct =
                    totalOrderUnits > 0
                      ? Math.round((checkedUnits / totalOrderUnits) * 100)
                      : 0;

                  const urgencyStyles = {
                    green: {
                      cardBorder:
                        order.status === 'preparando'
                          ? 'border-sky-400 shadow-lg shadow-sky-500/10'
                          : 'border-emerald-500/70',
                      headerBg: 'bg-emerald-500/15 border-b border-emerald-500/30',
                      timerBadge: 'bg-emerald-500 text-slate-950',
                    },
                    yellow: {
                      cardBorder: 'border-amber-400 shadow-lg shadow-amber-500/15',
                      headerBg: 'bg-amber-500/20 border-b border-amber-500/40',
                      timerBadge: 'bg-amber-400 text-slate-950',
                    },
                    red: {
                      cardBorder:
                        'border-rose-500 shadow-xl shadow-rose-500/25 ring-2 ring-rose-500/50',
                      headerBg: 'bg-rose-600/30 border-b border-rose-500 animate-pulse',
                      timerBadge: 'bg-rose-600 text-white animate-bounce',
                    },
                  }[urgency];

                  return (
                    <article
                      key={order.id}
                      className={`rounded-2xl bg-slate-900 border-2 flex flex-col justify-between overflow-hidden transition-all ${urgencyStyles.cardBorder}`}
                    >
                      <div>
                        <div className={`p-3.5 ${urgencyStyles.headerBg}`}>
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="text-xs font-black uppercase px-2 py-0.5 rounded bg-slate-950 text-amber-400 border border-amber-500/30">
                                  FIFO #{fifoIndex + 1}
