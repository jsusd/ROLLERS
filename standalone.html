                            max="500"
                            value={batchQty}
                            onChange={(e) => {
                              const raw = e.target.value;
                              if (raw === '') setBatchQty('');
                              else {
                                const n = parseInt(raw, 10);
                                if (!isNaN(n)) setBatchQty(Math.max(1, Math.min(500, n)));
                              }
                            }}
                            className="w-16 bg-slate-900 border border-sky-500/50 rounded-xl py-1 text-center text-lg font-black text-sky-300 focus:outline-none"
                          />
                          <button
                            type="button"
                            onClick={() =>
                              setBatchQty((q) => Math.min(500, (parseInt(q, 10) || 0) + 1))
                            }
                            className="w-9 h-9 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-base"
                          >
                            +
                          </button>
                          <span className="text-xs font-bold text-slate-400">rolls</span>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-black uppercase text-sky-300 mb-2">
                          3. Tiempo estimado para salir:
                        </label>
                        <div className="flex flex-wrap gap-1.5">
                          {[5, 8, 10, 15, 20].map((mins) => (
                            <button
                              key={mins}
                              type="button"
                              onClick={() => setOvenMinutes(mins)}
                              className={`px-3 py-2 rounded-xl text-xs font-black transition-all ${
                                ovenMinutes === mins
                                  ? 'bg-sky-500 text-slate-950 shadow-md scale-105'
                                  : 'bg-slate-950 border border-slate-800 text-slate-300 hover:text-white'
                              }`}
                            >
                              ⏳ {mins} min
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className="p-3 rounded-2xl bg-sky-500/10 border border-sky-500/30 text-sky-200 text-xs font-bold">
                      Vista previa del aviso en Barra:
                      <div className="mt-1 text-sm font-black text-sky-300">
                        {selectedFlavorId === 'SIN_SABOR'
                          ? `⏳ EN HORNO: Próxima tanda de ${Math.max(1, parseInt(batchQty, 10) || 1)} rolls SIN SABOR (Sabor Modificable) lista en ${ovenMinutes} min`
                          : `⏳ EN HORNO: Próxima tanda de ${Math.max(1, parseInt(batchQty, 10) || 1)} rolls de ${
                              flavors.find((f) => f.id === selectedFlavorId)?.name || ''
                            } lista en ${ovenMinutes} min`}
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={handleSendInOven}
                      className="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-500 via-blue-500 to-indigo-500 hover:from-sky-400 hover:to-blue-400 text-slate-950 font-black text-base uppercase tracking-wide shadow-xl active:scale-95"
                    >
                      🚀 Enviar Tiempo Estimado a Barra
                    </button>
                  </div>
                )}

                {/* Contenido TAB 3: Agotado (86) / Reabastecido */}
                {broadcastTab === '86' && (
                  <div className="space-y-3">
                    <p className="text-xs text-slate-400">
                      Al marcar un sabor como agotado, se bloquea al instante en la pantalla de Barra y suena una alarma para que no vendan más unidades.
                    </p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[380px] overflow-y-auto pr-1">
                      {flavors.map((flv) => {
                        const imgSrc = getRollImage(flv);
                        return (
                          <div
                            key={flv.id}
                            className={`p-3 rounded-2xl border-2 flex items-center justify-between gap-3 ${
                              !flv.available
                                ? 'bg-rose-950/40 border-rose-600/70'
                                : 'bg-slate-950 border-slate-800'
                            }`}
                          >
                            <div className="flex items-center gap-2.5 min-w-0">
                              {imgSrc ? (
                                <img
                                  src={imgSrc}
                                  alt={flv.name}
                                  className="w-10 h-10 rounded-full object-cover border border-amber-400/40 shrink-0"
                                />
                              ) : (
                                <span className="text-2xl">{flv.emoji}</span>
                              )}
                              <div className="min-w-0">
                                <p className="text-xs font-black text-white truncate">{flv.name}</p>
                                <span
                                  className={`text-[10px] font-black uppercase px-1.5 py-0.5 rounded ${
                                    flv.available
                                      ? 'bg-emerald-500/20 text-emerald-400'
                                      : 'bg-rose-500/30 text-rose-300'
                                  }`}
                                >
                                  {flv.available ? 'En Vitrina' : 'AGOTADO (86)'}
                                </span>
                              </div>
                            </div>

                            <button
                              type="button"
                              onClick={() => {
                                onToggleFlavorAvailability(flv.id);
                                setBroadcastToast(
                                  flv.available
                                    ? `🚫 ${flv.name} marcado como AGOTADO`
                                    : `🟢 ${flv.name} marcado como DISPONIBLE`
                                );
                                setTimeout(() => setBroadcastToast(null), 3500);
                              }}
                              className={`px-3 py-2 rounded-xl text-xs font-black uppercase transition-all shrink-0 ${
                                flv.available
                                  ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-lg'
                                  : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-lg'
                              }`}
                            >
                              {flv.available ? '🚫 Marcar 86' : '🟢 Reabastecer'}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Contenido TAB 4: Mensaje Rápido */}
                {broadcastTab === 'mensaje' && (
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-black uppercase text-purple-300 mb-2">
                        Mensajes rápidos de 1 toque:
                      </label>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {[
                          '📦 Manden más bandejas a cocina',
                          '⚠️ Cocina al límite, esperar 3 min',
                          '☕ Preparando pedidos especiales',
                          '✨ Todo al día y despachado',
                          '📦 Cajas de empaque listas en mostrador',
                          '🔥 Próximas tandas listas en 5 min',
                        ].map((chip) => (
                          <button
                            key={chip}
                            type="button"
                            onClick={() => handleSendCustomMessage(chip)}
                            className="p-3 rounded-2xl bg-slate-950 border border-slate-800 hover:border-purple-400 text-left text-xs font-black text-slate-200 hover:text-white transition-all active:scale-95"
                          >
                            {chip}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-300 mb-2">
                        O escribe un mensaje personalizado:
                      </label>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={customMsg}
                          onChange={(e) => setCustomMsg(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') handleSendCustomMessage();
                          }}
                          placeholder="Ej. Esperen 4 min para el pedido de Carlos..."
                          className="flex-1 h-12 bg-slate-950 border border-slate-800 focus:border-purple-400 rounded-2xl px-4 text-sm font-bold text-white outline-none"
                        />
                        <button
                          type="button"
                          onClick={() => handleSendCustomMessage()}
                          disabled={!customMsg.trim()}
                          className="px-5 py-3 rounded-2xl bg-purple-600 hover:bg-purple-500 disabled:bg-slate-800 text-white font-black text-sm uppercase shadow-lg transition-all"
                        >
                          Enviar
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 6. VISTA 3: ADMIN, SALA CENTRALIZADA, MÉTRICAS Y PRESERVACIÓN DE SABORES
    // ============================================================================
    function AdminView({
      flavors,
      orders,
      roomCode,
      onSaveFlavors,
      onResetDemoData,
      onClearAllOrders,
      onRestoreFactoryFlavors,
      onSetRoomCode,
    }) {
      const [newName, setNewName] = useState('');
      const [newCode, setNewCode] = useState('');
      const [newColor, setNewColor] = useState('amber');
      const [newEmoji, setNewEmoji] = useState('🥐');
      const [newDateRange, setNewDateRange] = useState('23/10 AL 01/11');

      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editCode, setEditCode] = useState('');
      const [editColor, setEditColor] = useState('amber');
      const [editEmoji, setEditEmoji] = useState('🥐');
      const [editDateRange, setEditDateRange] = useState('');

      const [inputRoom, setInputRoom] = useState(roomCode);
      const [feedback, setFeedback] = useState(null);
      const [showFactoryConfirm, setShowFactoryConfirm] = useState(false);

      const handleAddFlavor = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        const code =
          newCode.trim().toUpperCase() ||
          newName.trim().slice(0, 3).toUpperCase();

        const created = {
          id: `flv-${Date.now()}`,
          name: newName.trim().toUpperCase(),
          shortCode: code,
          color: newColor,
          emoji: newEmoji || '🥐',
          dateRange: newDateRange.trim() || '23/10 AL 01/11',
          available: true,
        };

        soundEngine.playTapSound(600);
        onSaveFlavors([...flavors, created]);
        setNewName('');
        setNewCode('');
        setFeedback(`¡Sabor "${created.name}" agregado y guardado!`);
        setTimeout(() => setFeedback(null), 3000);
      };

      const startEditFlavor = (flavor) => {
        setEditingId(flavor.id);
        setEditName(flavor.name);
        setEditCode(flavor.shortCode);
        setEditColor(flavor.color);
        setEditEmoji(flavor.emoji);
        setEditDateRange(flavor.dateRange || '23/10 AL 01/11');
      };

      const saveEditFlavor = (id) => {
        if (!editName.trim()) return;
        soundEngine.playTapSound(580);
        onSaveFlavors(
          flavors.map((f) =>
            f.id === id
              ? {
                  ...f,
                  name: editName.trim().toUpperCase(),
                  shortCode: editCode.trim().toUpperCase() || f.shortCode,
                  color: editColor,
                  emoji: editEmoji,
                  dateRange: editDateRange.trim() || f.dateRange,
                }
              : f
          )
        );
        setEditingId(null);
        setFeedback('Sabor actualizado con éxito');
        setTimeout(() => setFeedback(null), 2500);
      };

      const toggleFlavor86 = (id) => {
        soundEngine.play86Alert();
        onSaveFlavors(
          flavors.map((f) =>
            f.id === id ? { ...f, available: !f.available } : f
          )
        );
      };

      const deleteFlavor = (id) => {
        soundEngine.playTapSound(320);
        onSaveFlavors(flavors.filter((f) => f.id !== id));
      };

      const handleUpdateRoom = (e) => {
        e.preventDefault();
        if (!inputRoom.trim()) return;
        onSetRoomCode(inputRoom.trim());
        setFeedback(`Conectado a la sala "${inputRoom.trim()}"`);
        setTimeout(() => setFeedback(null), 3000);
      };

      const dispatchedOrders = orders.filter((o) => o.status === 'despachado');
      const activeOrders = orders.filter((o) => o.status !== 'despachado');
      const totalDispatchedUnits = dispatchedOrders.reduce(
        (sum, o) => sum + o.items.reduce((s, i) => s + i.quantity, 0),
        0
      );
      const totalAllUnits = orders.reduce(
        (sum, o) => sum + o.items.reduce((s, i) => s + i.quantity, 0),
        0
      );

      const dispatchDurationsSec = dispatchedOrders
        .filter((o) => o.dispatchedAt && o.dispatchedAt > o.createdAt)
        .map((o) => Math.round((o.dispatchedAt - o.createdAt) / 1000));

      const avgDispatchSec =
        dispatchDurationsSec.length > 0
          ? Math.round(
              dispatchDurationsSec.reduce((a, b) => a + b, 0) /
                dispatchDurationsSec.length
            )
          : 0;

      const formatDuration = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}m ${String(s).padStart(2, '0')}s`;
      };

      const flavorRanking = flavors
        .map((f) => {
          let soldDispatched = 0;
          let soldActive = 0;
          orders.forEach((o) => {
            o.items.forEach((item) => {
              if (item.flavorId === f.id || item.flavorName === f.name) {
                if (o.status === 'despachado') soldDispatched += item.quantity;
                else soldActive += item.quantity;
              }
            });
          });
          return {
            flavor: f,
            soldDispatched,
            soldActive,
            totalSold: soldDispatched + soldActive,
          };
        })
        .sort((a, b) => b.totalSold - a.totalSold);

      const maxFlavorSold = Math.max(1, ...flavorRanking.map((r) => r.totalSold));

      const handleExportCSV = () => {
        const rows = [
          ['REPORTE DE CIERRE BULL MARKET - POS & KDS'],
          ['Fecha Exportacion', new Date().toLocaleString()],
          ['Total Comandas Despachadas', String(dispatchedOrders.length)],
          ['Total Unidades Vendidas', String(totalAllUnits)],
          ['Tiempo Promedio Despacho', formatDuration(avgDispatchSec)],
          [],
          ['RANKING POR SABOR'],
          ['Codigo', 'Sabor', 'Despachados', 'En Cola', 'Total', 'Estado'],
          ...flavorRanking.map((r) => [
            r.flavor.shortCode,
            r.flavor.name,
            String(r.soldDispatched),
            String(r.soldActive),
            String(r.totalSold),
            r.flavor.available ? 'DISPONIBLE' : 'AGOTADO (86)',
          ]),
          [],
          ['DETALLE DE COMANDAS'],
          ['Ticket', 'Cliente / Mesa', 'Modalidad', 'Estado', 'Hora', 'Detalle', 'Nota'],
          ...orders.map((o) => [
            o.ticketNumber,
            o.customerOrTable,
            o.orderType === 'comer_aqui' ? 'Comer Aqui' : 'Para Llevar',
            o.status.toUpperCase(),
            new Date(o.createdAt).toLocaleTimeString(),
            o.items.map((i) => `${i.quantity}x ${i.flavorName}`).join(' | '),
            o.note || '',
          ]),
        ];

        const csvContent =
          '\uFEFF' +
          rows
            .map((r) =>
              r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')
            )
            .join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BullMarket-Cierre-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleCopyForGoogleSheets = () => {
        const header = ['Sabor', 'Codigo', 'Despachados', 'En Cola', 'Total', 'Estado'].join('\t');
        const lines = flavorRanking.map((r) =>
          [
            r.flavor.name,
            r.flavor.shortCode,
            r.soldDispatched,
            r.soldActive,
            r.totalSold,
            r.flavor.available ? 'Disponible' : 'Agotado (86)',
          ].join('\t')
        );
        navigator.clipboard.writeText([header, ...lines].join('\n')).then(() => {
          setFeedback('✅ ¡Tabla copiada! Abre Google Sheets y presiona Ctrl+V');
          setTimeout(() => setFeedback(null), 3500);
        });
      };

      return (
        <div className="max-w-[1650px] mx-auto p-3 md:p-6 space-y-6 text-white">
          {/* BANNER DE SINCRONIZACIÓN CENTRALIZADA MULTI-DISPOSITIVO */}
          <section className="bg-gradient-to-r from-sky-950/70 via-slate-900 to-amber-950/50 border-2 border-sky-500/40 rounded-3xl p-4 md:p-5 shadow-xl">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-3 bg-sky-500/20 border border-sky-400 rounded-2xl text-2xl">
                  🌐
                </div>
                <div>
                  <h2 className="text-base md:text-lg font-black uppercase tracking-wide text-white flex items-center gap-2">
                    Sincronización Centralizada Multi-Dispositivo
                    <span className="bg-emerald-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full">
                      EN VIVO (NUBE)
                    </span>
                  </h2>
                  <p className="text-xs text-slate-300 mt-0.5">
                    Cualquier pedido o cambio realizado en un teléfono, tablet o PC se sincroniza al instante en todos los demás.
                  </p>
                </div>
              </div>

              <form onSubmit={handleUpdateRoom} className="flex items-center gap-2">
                <div>
                  <span className="block text-[10px] font-bold uppercase text-slate-400">
                    Código de Sala / Tienda:
                  </span>
                  <input
                    type="text"
                    value={inputRoom}
                    onChange={(e) => setInputRoom(e.target.value)}
                    placeholder={DEFAULT_ROOM_CODE}
                    className="h-10 rounded-xl bg-slate-950 border border-sky-500/50 px-3 text-xs font-black text-sky-300 uppercase tracking-wider"
                  />
                </div>
                <button
                  type="submit"
                  className="mt-4 h-10 px-4 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs uppercase"
                >
                  Conectar
                </button>
              </form>
            </div>
          </section>

          {/* MÉTRICAS Y NUEVO DÍA */}
          <section className="bg-slate-900 border border-slate-800 rounded-3xl p-4 md:p-6 shadow-xl">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-5 border-b border-slate-800 pb-4">
              <div>
                <h2 className="text-lg md:text-xl font-black uppercase tracking-wide">
                  📊 Métricas del Día &amp; Cierre de Caja
                </h2>
                <p className="text-xs text-slate-400">
                  Estadísticas de despacho y ranking de sabores en vivo
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={handleExportCSV}
                  className="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs md:text-sm"
                >
                  📥 Exportar CSV (Excel / Sheets)
                </button>
                <button
                  type="button"
                  onClick={handleCopyForGoogleSheets}
                  className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs md:text-sm border border-slate-700"
                >
                  📋 Copiar para Google Sheets
                </button>
              </div>
            </div>

            {feedback && (
              <div className="mb-4 bg-emerald-500/20 border border-emerald-400 text-emerald-200 px-4 py-2.5 rounded-xl text-xs font-bold">
                {feedback}
              </div>
            )}

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs font-bold uppercase text-slate-400 block">
                  Comandas Despachadas
                </span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-3xl md:text-4xl font-black text-emerald-400 tabular-nums">
                    {dispatchedOrders.length}
                  </span>
                  <span className="text-xs font-bold text-slate-400">
                    (+{activeOrders.length} en cola)
                  </span>
                </div>
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs font-bold uppercase text-slate-400 block">
                  Total Unidades Vendidas
                </span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-3xl md:text-4xl font-black text-amber-400 tabular-nums">
                    {totalAllUnits}
                  </span>
                  <span className="text-xs font-bold text-slate-400">
                    ({totalDispatchedUnits} despachadas)
                  </span>
                </div>
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs font-bold uppercase text-slate-400 block">
                  Tiempo Promedio Despacho
                </span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-3xl md:text-4xl font-black text-sky-400 tabular-nums">
                    {avgDispatchSec > 0 ? formatDuration(avgDispatchSec) : '02m 10s'}
                  </span>
                </div>
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs font-bold uppercase text-slate-400 block">
                  🏆 Sabor #1 del Día
                </span>
                <div className="mt-1 truncate">
                  <span className="text-lg md:text-xl font-black text-white">
                    {flavorRanking[0]
                      ? `${flavorRanking[0].flavor.emoji} ${flavorRanking[0].flavor.name}`
                      : 'Sin datos'}
                  </span>
                  {flavorRanking[0] && (
                    <span className="block text-xs font-bold text-violet-300">
                      {flavorRanking[0].totalSold} unidades
                    </span>
                  )}
                </div>
              </div>
            </div>

            {/* SEPARACIÓN CLARA: INICIAR NUEVO DÍA (CONSERVA SABORES) */}
            <div className="bg-slate-950/80 border-2 border-amber-500/40 rounded-2xl p-4 mb-6">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h3 className="text-sm font-black uppercase text-amber-400 flex items-center gap-1.5">
                    ☀️ Iniciar Nuevo Día / Reiniciar Jornada
                  </h3>
                  <p className="text-xs text-slate-300">
                    Limpia las comandas a cero y reinicia el ticket a #001. <strong>Tus sabores creados nunca se borran.</strong>
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      onClearAllOrders();
                      setFeedback('☀️ ¡Nuevo día iniciado! Comandas en 0. Todos los sabores creados se mantienen intactos.');
                      setTimeout(() => setFeedback(null), 4000);
                    }}
                    className="py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs md:text-sm uppercase flex items-center gap-2 shadow-lg shadow-amber-500/25 active:scale-95"
                  >
                    ☀️ Iniciar Nuevo Día (Conserva Sabores)
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      onResetDemoData();
                      setFeedback('Comandas de prueba cargadas con tus sabores actuales.');
                      setTimeout(() => setFeedback(null), 3000);
                    }}
                    className="py-3 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs uppercase border border-slate-700"
                  >
                    🔄 Cargar Demo
                  </button>

                  <button
                    type="button"
                    onClick={() => setShowFactoryConfirm(true)}
                    className="py-3 px-3 rounded-xl bg-rose-950/40 hover:bg-rose-900/60 border border-rose-500/30 text-rose-300 font-bold text-xs uppercase"
                  >
                    ⚠️ Restaurar Fábrica
                  </button>
                </div>
              </div>

              {showFactoryConfirm && (
                <div className="mt-4 p-3 bg-rose-950/80 border border-rose-500 rounded-xl flex items-center justify-between gap-3 text-xs">
                  <span className="text-rose-200 font-bold">
                    ¿Deseas restaurar los 10 sabores originales de fábrica de Bull Market?
                  </span>
                  <div className="flex items-center gap-2">
                    <button

            {/* Ranking de Sabores */}
            <div className="space-y-2.5">
              {flavorRanking.map((row, idx) => {
                const palette = COLOR_PALETTE[row.flavor.color] || COLOR_PALETTE.amber;
                const widthPct = Math.max(4, Math.round((row.totalSold / maxFlavorSold) * 100));

                  <div

          {/* GESTOR DE SABORES EN VIVO Y 86 */}
          <section className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-3xl p-4 md:p-6">
              <h2 className="text-lg font-black uppercase tracking-wide mb-1">

              <p className="text-xs text-slate-400 mb-4">
                Los sabores guardados son persistentes en todos tus dispositivos.
              </p>

              <div className="space-y-3">
                {flavors.map((flavor) => {
                  const palette = COLOR_PALETTE[flavor.color] || COLOR_PALETTE.amber;
                  const isEditing = editingId === flavor.id;
                  const imgSrc = getRollImage(flavor);

                  return (
                    <div
                      key={flavor.id}
                      className={`rounded-2xl border-2 p-3.5 ${
                        flavor.available
                          ? 'bg-slate-950 border-slate-800'

                    >
                      {isEditing ? (
                        <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
                          <input
                            type="text"
                            value={editEmoji}
                            onChange={(e) => setEditEmoji(e.target.value)}
                            className="sm:col-span-1 h-10 rounded-xl bg-slate-900 border border-slate-700 text-center text-xl"
                          />
                          <input
                            type="text"
                            value={editName}
                            onChange={(e) => setEditName(e.target.value)}
                            className="sm:col-span-4 h-10 rounded-xl bg-slate-900 border border-slate-700 px-3 text-sm font-bold text-white uppercase"
                          />
                          <input
                            type="text"

                          <select
                            value={editColor}

                            className="sm:col-span-3 h-10 rounded-xl bg-slate-900 border border-slate-700 px-2 text-xs font-bold text-white"
                          >
                            {Object.entries(COLOR_PALETTE).map(([k, v]) => (

                                {v.label}

                          </select>
                          <button
                            type="button"
                            onClick={() => saveEditFlavor(flavor.id)}
                            className="sm:col-span-2 h-10 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs"
                          >
                            💾 Guardar
                          </button>
                        </div>
                      ) : (
                        <div className="flex flex-wrap items-center justify-between gap-3">
                          <div className="flex items-center gap-3">
                            {imgSrc ? (
                              <img
                                src={imgSrc}
                                alt={flavor.name}
                                className="w-12 h-12 rounded-full object-cover border-2 border-amber-400/50 shrink-0"
                              />
                            ) : (
                              <span className="text-3xl">{flavor.emoji}</span>
                            )}
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-extrabold text-base text-white uppercase">
                                  {flavor.name}
                                </span>
                                <span
                                  className={`text-[10px] font-black uppercase px-2 py-0.5 rounded ${palette.badgeBg}`}
                                >
                                  {flavor.dateRange || flavor.shortCode}
                                </span>
                              </div>
                              <span className="text-xs text-slate-400">
                                Color: {palette.label}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              type="button"
                              onClick={() => toggleFlavor86(flavor.id)}
                              className={`px-3.5 py-2 rounded-xl font-black text-xs uppercase border transition-all ${
                                flavor.available
                                  ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 hover:bg-rose-500/20 hover:text-rose-300'
                                  : 'bg-rose-600 border-rose-400 text-white shadow-lg'
                              }`}
                            >
                              {flavor.available
                                ? '✅ Disponible (Click para 86)'
                                : '🚫 AGOTADO (86) - Click para Activar'}
                            </button>

                            <button
                              type="button"
                              onClick={() => startEditFlavor(flavor)}
                              className="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-300 border border-slate-700"
                            >
                              ✏️ Editar
                            </button>

                            <button
                              type="button"
                              onClick={() => deleteFlavor(flavor.id)}
                              className="px-3 py-2 rounded-xl bg-slate-900 hover:bg-rose-600 text-xs font-bold text-slate-400 hover:text-white border border-slate-700"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="lg:col-span-4 space-y-6">
              <form
                onSubmit={handleAddFlavor}
                className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4"
              >
                <h3 className="text-base font-black uppercase tracking-wide text-amber-400">
                  ➕ Agregar Nuevo Sabor al Menú
                </h3>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1">
                    Nombre del Sabor
                  </label>
                  <input
                    type="text"
                    required
                    value={newName}
                    onChange={(e) => setNewName(e.target.value)}
                    placeholder="Ej. MANJAR BLANCO"
                    className="w-full h-11 rounded-xl bg-slate-950 border border-slate-700 px-3 text-sm font-bold text-white uppercase"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-400 mb-1">
                      Código (3 letras)
                    </label>
                    <input
                      type="text"
                      maxLength={4}
                      value={newCode}
                      onChange={(e) => setNewCode(e.target.value)}
                      placeholder="MAN"
                      className="w-full h-11 rounded-xl bg-slate-950 border border-slate-700 px-3 text-sm font-black uppercase text-amber-400"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-400 mb-1">
                      Color del Botón
                    </label>
                    <select
                      value={newColor}
                      onChange={(e) => setNewColor(e.target.value)}
                      className="w-full h-11 rounded-xl bg-slate-950 border border-slate-700 px-2.5 text-xs font-bold text-white"
                    >
                      {Object.entries(COLOR_PALETTE).map(([k, v]) => (
                        <option key={k} value={k}>
                          {v.label}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1">
                    Rango de Fechas / Etiqueta
                  </label>
                  <input
                    type="text"
                    value={newDateRange}
                    onChange={(e) => setNewDateRange(e.target.value)}
                    placeholder="Ej. 23/10 AL 01/11"
                    className="w-full h-10 rounded-xl bg-slate-950 border border-slate-700 px-3 text-xs font-bold text-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1">
                    Emoji
                  </label>
                  <div className="flex flex-wrap gap-1.5">
                    {EMOJI_PRESETS.map((em) => (
                      <button
                        key={em}
                        type="button"
                        onClick={() => setNewEmoji(em)}
                        className={`w-9 h-9 rounded-lg text-lg flex items-center justify-center border ${
                          newEmoji === em
                            ? 'bg-amber-500/30 border-amber-400'
                            : 'bg-slate-950 border-slate-800'
                        }`}
                      >
                        {em}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm uppercase tracking-wide shadow-lg"
                >
                  + Guardar Sabor en Catálogo
                </button>

      );
    }

    // ============================================================================
    // 7. APLICACIÓN PRINCIPAL (SHELL CON NAVEGACIÓN Y MULTI-DISPOSITIVO)
    // ============================================================================
    function App() {
      const [state, setState] = useState(() => getInitialState());
      const [route, setRoute] = useState(() => {
        const hash = window.location.hash.replace('#', '');
        if (hash === '/panaderia' || hash === '/admin' || hash === '/dual') {
          return hash;
        }
        return '/barra';
      });
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [incomingBanner, setIncomingBanner] = useState(null);
      const prevOrderCountRef = useRef(state.orders.length);

      useEffect(() => {
        const unsubscribe = syncEngine.subscribe((newState, meta) => {
          prevOrderCountRef.current = newState.orders.length;
          setState(newState);

          if (meta?.isNewOrder) {
            soundEngine.playNewOrderBell();
            const newest = meta.newOrder || newState.orders[newState.orders.length - 1];
            if (newest) {
              setIncomingBanner(
                `🔔 ¡NUEVA COMANDA ${newest.ticketNumber} (${newest.customerOrTable}) EN COLA DE PANADERÍA!`
              );
              setTimeout(() => setIncomingBanner(null), 4500);
            }
          } else if (meta?.isOrderReady && meta?.readyOrder) {
            soundEngine.playOrderDispatchedSound();
            setIncomingBanner(
              `✅ ¡PEDIDO ${meta.readyOrder.ticketNumber} (${meta.readyOrder.customerOrTable}) SALIÓ DE PANADERÍA! LISTO PARA ENTREGAR`
            );
            setTimeout(() => setIncomingBanner(null), 5500);
          } else if (meta?.isOrderPreparing && meta?.preparingOrder) {
            soundEngine.playTapSound(640);
            setIncomingBanner(
              `🧑‍🍳 PANADERÍA ESTÁ PREPARANDO EL PEDIDO ${meta.preparingOrder.ticketNumber} (${meta.preparingOrder.customerOrTable})`
            );
            setTimeout(() => setIncomingBanner(null), 4000);
          } else if (meta?.isNewAnnouncement && meta?.announcement) {
            if (meta.announcement.type === 'flavor_86') {
              soundEngine.play86Alert();
            } else {
              soundEngine.playAnnouncementSound();
            }
            setIncomingBanner(`📢 AVISO DE PANADERÍA: ${meta.announcement.text}`);
            setTimeout(() => setIncomingBanner(null), 5000);
          }
        });
        return () => unsubscribe();
      }, []);

      const navigate = (nextRoute) => {
        soundEngine.playTapSound(500);
        setRoute(nextRoute);
        window.location.hash = nextRoute;
      };

      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        soundEngine.enabled = next;
        if (next) soundEngine.playNewOrderBell();
      };

      const handleCreateOrder = (orderData) => {
        const maxExistingNum = state.orders.reduce((max, o) => {
          const m = String(o.ticketNumber || '').match(/\d+/);
          return m ? Math.max(max, parseInt(m[0], 10)) : max;
        }, 0);
        const nextSeqNum = Math.max(state.nextTicketSeq || 1, maxExistingNum + 1);

        const newOrder = {
          id: `ord-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          ticketNumber: orderData.ticketNumber || `#${String(nextSeqNum).padStart(3, '0')}`,
          customerOrTable: orderData.customerOrTable,
          orderType: orderData.orderType,
          note: orderData.note,
          items: orderData.items,
          status: 'pendiente',
          modCount: 1,
          delivered: false,
          createdAt: Date.now(),
        };

        const nextState = {
          ...state,
          orders: [...state.orders, newOrder],
          nextTicketSeq: nextSeqNum + 1,
          lastUpdated: Date.now(),
        };

        prevOrderCountRef.current = nextState.orders.length;
        syncEngine.publishState(nextState, {
          isNewOrder: true,
          newOrder,
          newOrderTicket: newOrder.ticketNumber,
        });

        if (route === '/panaderia' || route === '/dual') {
          soundEngine.playNewOrderBell();
        }
      };

      const handleUpdateOrderStatus = (orderId, nextStatus) => {
        const now = Date.now();
        let targetOrder = null;
        const updatedOrders = state.orders.map((ord) => {
          if (ord.id !== orderId) return ord;
          const updated = {
            ...ord,
            status: nextStatus,
            modCount: (ord.modCount || 1) + 1,
            startedAt:
              nextStatus === 'preparando' && !ord.startedAt ? now : ord.startedAt,
            dispatchedAt: nextStatus === 'despachado' ? now : ord.dispatchedAt,
          };
          targetOrder = updated;
          return updated;
        });

        syncEngine.publishState(
          { ...state, orders: updatedOrders, lastUpdated: now },
          {
            isOrderPreparing: nextStatus === 'preparando',
            preparingOrder: nextStatus === 'preparando' ? targetOrder : null,
            isOrderReady: nextStatus === 'despachado',
            readyOrder: nextStatus === 'despachado' ? targetOrder : null,
          }
        );
      };

      const handleToggleOrderItemCheck = (orderId, flavorId) => {
        const updatedOrders = state.orders.map((ord) => {
          if (ord.id !== orderId) return ord;
          const nextItems = ord.items.map((item) =>
            item.flavorId === flavorId ? { ...item, checked: !item.checked } : item
          );
          return {
            ...ord,
            modCount: (ord.modCount || 1) + 1,
            items: nextItems,
          };
        });
        syncEngine.publishState({
          ...state,
          orders: updatedOrders,
          lastUpdated: Date.now(),
        });
      };

      const handleToggleOrderDelivered = (orderId) => {
        const updatedOrders = state.orders.map((ord) => {
          if (ord.id !== orderId) return ord;
          return {
            ...ord,
            delivered: !ord.delivered,
            modCount: (ord.modCount || 1) + 1,
          };
        });
        syncEngine.publishState({
          ...state,
          orders: updatedOrders,
          lastUpdated: Date.now(),
        });
      };

      const handleCreateAnnouncement = (annData) => {
        const newAnn = {
          id: `ann-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          type: annData.type,
          flavorId: annData.flavorId || null,
          flavorName: annData.flavorName || null,
          isCustomizableFlavor: Boolean(annData.isCustomizableFlavor || annData.flavorId === 'SIN_SABOR'),
          quantity: typeof annData.quantity === 'number' ? annData.quantity : null,
          initialQuantity: typeof annData.quantity === 'number' ? annData.quantity : null,
          minutes: annData.minutes || null,
          modCount: 1,
          text: annData.text || annData.message || '',
          createdAt: Date.now(),
        };

        const existingAnnouncements = Array.isArray(state.announcements) ? state.announcements : [];
        const nextAnnouncements = [newAnn, ...existingAnnouncements].slice(0, 20);

        const nextState = {
          ...state,
          announcements: nextAnnouncements,
          lastUpdated: Date.now(),
        };

        syncEngine.publishState(nextState, {
          isNewAnnouncement: true,
          announcement: newAnn,
        });

        soundEngine.playAnnouncementSound();
      };

      const handleUpdateAnnouncementQuantity = (annId, nextQty) => {
        const cleanQty = Math.max(0, Math.min(500, parseInt(nextQty, 10) || 0));
        const existingAnnouncements = Array.isArray(state.announcements) ? state.announcements : [];
        const updatedAnnouncements = existingAnnouncements.map((a) => {
          if (!a || a.id !== annId) return a;
          const isSinSabor = Boolean(a.isCustomizableFlavor || a.flavorId === 'SIN_SABOR');
          let nextText = a.text;

          if (a.type === 'batch_ready') {
            if (cleanQty === 0) {
              nextText = isSinSabor
                ? '🚫 Tanda SIN SABOR agotada (0 disponibles)'
                : `🚫 Tanda de ${a.flavorName || 'rolls'} agotada (0 disponibles)`;
            } else if (isSinSabor) {
              nextText = `🔥 ¡TANDA SIN SABOR LISTA! Salieron ${cleanQty} rolls base — SE PUEDE MODIFICAR EL SABOR`;
            } else {
              nextText = `🔥 ¡TANDA LISTA! Salieron ${cleanQty} rolls de ${a.flavorName || ''} recién horneados`;
            }
          } else if (a.type === 'in_oven') {
            if (isSinSabor) {
              nextText = `⏳ EN HORNO: Próxima tanda de ${cleanQty} rolls SIN SABOR (Sabor Modificable) lista en ${a.minutes || 10} min`;
            } else {
              nextText = `⏳ EN HORNO: Próxima tanda de ${cleanQty} rolls de ${a.flavorName || ''} lista en ${a.minutes || 10} min`;
            }
          }

          return {
            ...a,
            quantity: cleanQty,
            text: nextText,
            modCount: (a.modCount || 1) + 1,
            updatedAt: Date.now(),
          };
        });

        syncEngine.publishState({
          ...state,
          announcements: updatedAnnouncements,
          lastUpdated: Date.now(),
        });
      };

      const handleToggleFlavorAvailability = (flavorId) => {
        const target = state.flavors.find((f) => f.id === flavorId);
        const willBeAvailable = target ? !target.available : false;

        const updatedFlavors = state.flavors.map((f) =>
          f.id === flavorId
            ? { ...f, available: !f.available, modCount: (f.modCount || 1) + 1 }
            : f
        );

        const newAnn = {
          id: `ann-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          type: willBeAvailable ? 'flavor_restocked' : 'flavor_86',
          flavorId: flavorId,
          flavorName: target?.name || '',
          text: willBeAvailable
            ? `🟢 ${target?.name || 'Sabor'} DISPONIBLE — Panadería lo reactivó en vitrina`
            : `🚫 ATENCIÓN BARRA: ${target?.name || 'Sabor'} AGOTADO (86). No vender más`,
          createdAt: Date.now(),
        };

        const existingAnnouncements = Array.isArray(state.announcements) ? state.announcements : [];
        const nextAnnouncements = [newAnn, ...existingAnnouncements].slice(0, 20);

        if (!willBeAvailable) {
          soundEngine.play86Alert();
        } else {
          soundEngine.playAnnouncementSound();
        }

        syncEngine.publishState(
          {
            ...state,
            flavors: updatedFlavors,
            announcements: nextAnnouncements,
            lastUpdated: Date.now(),
          },
          {
            isNewAnnouncement: true,
            announcement: newAnn,
          }
        );
      };

      const handleSaveFlavors = (nextFlavors) => {
        const bumped = nextFlavors.map((f) => ({
          ...f,
          modCount: (f.modCount || 1) + 1,
        }));
        syncEngine.publishState({
          ...state,
          flavors: bumped,
          lastUpdated: Date.now(),
        });
      };

      // Iniciar Nuevo Día: INCREMENTA EPOCH PARA LIMPIAR EN TODOS LOS DISPOSITIVOS Y CONSERVA SABORES
      const handleClearAllOrders = () => {
        soundEngine.playTapSound(350);
        prevOrderCountRef.current = 0;
        syncEngine.publishState({
          ...state,
          epoch: (state.epoch || 1) + 1,
          orders: [],
          announcements: [],
          nextTicketSeq: 1,
          lastUpdated: Date.now(),
        });
      };

      // Cargar Demo: CONSERVA LOS SABORES CREADOS
      const handleResetDemoData = () => {
        soundEngine.playNewOrderBell();
        const currentFlavors = ensureAllCanonicalFlavors(state.flavors);
        const demoOrders = createInitialDemoOrders(currentFlavors);
        prevOrderCountRef.current = demoOrders.length;
        syncEngine.publishState({
          ...state,
          epoch: (state.epoch || 1) + 1,
          flavors: currentFlavors,
          orders: demoOrders,
          nextTicketSeq: demoOrders.length + 1,
          lastUpdated: Date.now(),
        });
      };

      // Restaurar Fábrica: SOLO SI SE CONFIRMA
      const handleRestoreFactoryFlavors = () => {
        soundEngine.play86Alert();
        const resetFlvs = INITIAL_FLAVORS.map((f) => ({ ...f, modCount: (state.version || 1) + 10 }));
        syncEngine.publishState({
          ...state,
          flavors: resetFlvs,
          lastUpdated: Date.now(),
        });
      };

      const activeOrderCount = state.orders.filter(
        (o) => o.status === 'pendiente' || o.status === 'preparando'
      ).length;

      const readyUndeliveredCount = state.orders.filter(
        (o) => o.status === 'despachado' && !o.delivered
      ).length;

      const totalPendingUnits = state.orders
        .filter((o) => o.status === 'pendiente' || o.status === 'preparando')
        .reduce((sum, o) => sum + o.items.reduce((s, i) => s + i.quantity, 0), 0);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* HEADER SUPERIOR CON INDICADOR MULTI-DISPOSITIVO */}
          <header className="sticky top-0 z-40 h-[64px] bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 md:px-6 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2.5 shrink-0">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-md">
                🐂
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-black text-base md:text-lg tracking-tight text-white">
                    BULL MARKET
                  </span>
                  <span className="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                    ● SYNC EN VIVO
                  </span>
                </div>
                <span className="block text-[10px] font-bold uppercase tracking-wider text-amber-400/90 -mt-0.5">
                  Sala: {state.roomCode || DEFAULT_ROOM_CODE}
                </span>
              </div>
            </div>

            <nav className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-2xl border border-slate-800">
              <button
                type="button"
                onClick={() => navigate('/barra')}
                className={`px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-xs md:text-sm flex items-center gap-1.5 transition-all ${
                  route === '/barra'
                    ? 'bg-amber-500 text-slate-950 shadow-md'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                <span>🍹 1. Barra / Mesero</span>
                {readyUndeliveredCount > 0 && (
                  <span className="px-1.5 py-0.2 rounded-full text-[10px] font-black bg-emerald-500 text-slate-950 animate-bounce">
                    ✓ {readyUndeliveredCount}
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={() => navigate('/panaderia')}
                className={`px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-xs md:text-sm flex items-center gap-1.5 transition-all ${
                  route === '/panaderia'
                    ? 'bg-orange-500 text-slate-950 shadow-md'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                <span>🔥 2. Panadería KDS</span>
                {activeOrderCount > 0 && (
                  <span
                    className={`px-1.5 py-0.2 rounded-full text-[11px] font-black tabular-nums ${
                      route === '/panaderia'
                        ? 'bg-slate-950 text-amber-400'
                        : 'bg-orange-500 text-slate-950'
                    }`}
                  >
                    {activeOrderCount} ({totalPendingUnits})
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={() => navigate('/admin')}
                className={`px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-xs md:text-sm transition-all ${
                  route === '/admin'
                    ? 'bg-sky-500 text-slate-950 shadow-md'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                ⚙️ 3. Admin &amp; 86
              </button>

              <button
                type="button"
                onClick={() => navigate('/dual')}
                className={`hidden xl:inline-flex px-3 py-1.5 rounded-xl font-extrabold text-xs transition-all ${
                  route === '/dual'
                    ? 'bg-emerald-500 text-slate-950 shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                🖥️ Vista Dual
              </button>
            </nav>

            <div className="flex items-center gap-2 shrink-0">
              <button
                type="button"
                onClick={() => {
                  soundEngine.playTapSound(560);
                  syncEngine.forceSyncNow();
                }}
                title="Sincronizar ahora con todos los dispositivos"
                className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-300 text-xs font-bold border border-slate-700 active:scale-95"
              >
                🔄 Sync
              </button>

              <button
                type="button"
                onClick={() => soundEngine.playNewOrderBell()}
                className="hidden sm:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold border border-slate-700"
              >
                🔔 Campana
              </button>

              <button
                type="button"
                onClick={toggleSound}
                className={`px-2.5 py-1.5 rounded-xl border text-xs font-bold ${
                  soundEnabled
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400'
                    : 'bg-rose-500/15 border-rose-500/40 text-rose-400'
                }`}
              >
                {soundEnabled ? '🔊 Audio ON' : '🔇 Mute'}
              </button>

              <button
                type="button"
                onClick={() => {
                  const url = `${window.location.href.split('#')[0]}#/panaderia`;
                  window.open(url, '_blank', 'width=1280,height=820');
                }}
                className="hidden md:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700"
              >
                ↗️ Abrir KDS
              </button>
            </div>
          </header>

          {incomingBanner && (
            <div className="bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 text-slate-950 font-black text-center py-2.5 px-4 text-sm uppercase tracking-wider shadow-lg animate-bounce z-50">
              {incomingBanner}
            </div>
          )}

          <div className="flex-1">
            {route === '/barra' && (
              <BarraView
                flavors={ensureAllCanonicalFlavors(state.flavors)}
                orders={state.orders}
                nextTicketSeq={state.nextTicketSeq}
                announcements={state.announcements || []}
                onCreateOrder={handleCreateOrder}
                onToggleOrderDelivered={handleToggleOrderDelivered}
                onUpdateAnnouncementQuantity={handleUpdateAnnouncementQuantity}
              />
            )}

            {route === '/panaderia' && (
              <PanaderiaView
                flavors={ensureAllCanonicalFlavors(state.flavors)}
                orders={state.orders}
                announcements={state.announcements || []}
                onUpdateOrderStatus={handleUpdateOrderStatus}
                onToggleOrderItemCheck={handleToggleOrderItemCheck}
                onToggleFlavorAvailability={handleToggleFlavorAvailability}
                onCreateAnnouncement={handleCreateAnnouncement}
                onUpdateAnnouncementQuantity={handleUpdateAnnouncementQuantity}
              />
            )}

            {route === '/admin' && (
              <AdminView
                flavors={ensureAllCanonicalFlavors(state.flavors)}
                orders={state.orders}
                roomCode={state.roomCode}
                onSaveFlavors={handleSaveFlavors}
                onResetDemoData={handleResetDemoData}
                onClearAllOrders={handleClearAllOrders}
                onRestoreFactoryFlavors={handleRestoreFactoryFlavors}
                onSetRoomCode={(r) => syncEngine.setRoomCode(r)}
              />
            )}

            {route === '/dual' && (
              <div className="grid grid-cols-1 xl:grid-cols-12 divide-y xl:divide-y-0 xl:divide-x divide-slate-800">
                <div className="xl:col-span-5 bg-slate-950">
                  <div className="bg-amber-500/10 border-b border-amber-500/30 px-4 py-2 text-xs font-black uppercase text-amber-400">
                    🍹 Vista Emisor de Barra / Mesero (/barra)
                  </div>
                  <BarraView
                    flavors={ensureAllCanonicalFlavors(state.flavors)}
                    orders={state.orders}
                    nextTicketSeq={state.nextTicketSeq}
                    announcements={state.announcements || []}
                    onCreateOrder={handleCreateOrder}
                    onToggleOrderDelivered={handleToggleOrderDelivered}
                    onUpdateAnnouncementQuantity={handleUpdateAnnouncementQuantity}
                  />
                </div>
                <div className="xl:col-span-7 bg-slate-950">
                  <div className="bg-orange-500/10 border-b border-orange-500/30 px-4 py-2 text-xs font-black uppercase text-orange-400">
                    🔥 Vista KDS Panadería en Vivo (/panaderia)
                  </div>
                  <PanaderiaView
                    flavors={ensureAllCanonicalFlavors(state.flavors)}
                    orders={state.orders}
                    announcements={state.announcements || []}
                    onUpdateOrderStatus={handleUpdateOrderStatus}
                    onToggleOrderItemCheck={handleToggleOrderItemCheck}
                    onToggleFlavorAvailability={handleToggleFlavorAvailability}
                    onCreateAnnouncement={handleCreateAnnouncement}
                    onUpdateAnnouncementQuantity={handleUpdateAnnouncementQuantity}
                  />
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
