    // ============================================================================
    // 2. MOTOR DE AUDIO NATIVO WEB AUDIO API (CAMPANA DOBLE DE COCINA)
    // ============================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      getContext() {
        if (!this.enabled) return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      playBellTone(ctx, freq, startTime, duration, peakGain) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      playNewOrderBell() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        this.playBellTone(ctx, 783.99, now, 0.55, 0.35);
        this.playBellTone(ctx, 1567.98, now, 0.25, 0.12);
        this.playBellTone(ctx, 659.25, now + 0.22, 0.75, 0.38);
        this.playBellTone(ctx, 1318.51, now + 0.22, 0.35, 0.12);
      }

      playOrderDispatchedSound() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          this.playBellTone(ctx, freq, now + idx * 0.07, 0.32, 0.22);
        });
      }

      playTapSound(pitch = 480) {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.045);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      play86Alert() {
        const ctx = this.getContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        this.playBellTone(ctx, 293.66, now, 0.2, 0.25);
        this.playBellTone(ctx, 220.0, now + 0.16, 0.35, 0.28);
      }
    }

    // Motor de sincronización centralizada en tiempo real (Multi-Dispositivo)
    class RealtimeSyncEngine {
      constructor() {
        this.listeners = new Set();
        this.channel = null;
        this.sseSource = null;
        this.deviceId = 'dev_' + Math.random().toString(36).substring(2, 9);
        this.currentState = getInitialState();

        if ('BroadcastChannel' in window) {
          this.channel = new BroadcastChannel(LOCAL_CHANNEL_NAME);
          this.channel.onmessage = (event) => {
            if (event.data && event.data.type === 'KDS_STATE_UPDATE') {
              if (event.data.deviceId === this.deviceId) return;
              this.handleIncomingState(event.data.state, event.data.meta);
            }
          };
        }

        window.addEventListener('storage', (e) => {
          if (e.key === STORAGE_STATE_KEY && e.newValue) {
            try {
              const newState = JSON.parse(e.newValue);
              this.handleIncomingState(newState);
            } catch (err) {}
          }
        });

        this.initCloudCentralizedSync();
        this.initLocalServerSync();
      }

      subscribe(listener) {
        this.listeners.add(listener);
        return () => this.listeners.delete(listener);
      }

      notify(state, meta) {
        this.currentState = state;
        this.listeners.forEach((fn) => fn(state, meta));
      }

      handleIncomingState(incoming, meta) {
        if (!incoming || !incoming.lastUpdated) return;
        if (incoming.lastUpdated <= this.currentState.lastUpdated) return;

        // Persistir sabores por separado para que NUNCA se borren
        if (incoming.flavors && incoming.flavors.length > 0) {
          saveFlavors(incoming.flavors);
        }

        try {
          localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(incoming));
        } catch (e) {}

        const isNew =
          meta?.isNewOrder ||
          (incoming.orders && incoming.orders.length > this.currentState.orders.length);

        this.notify(incoming, { isNewOrder: isNew, newOrderTicket: meta?.newOrderTicket });
      }

      publishState(nextState, meta) {
        const stamped = { ...nextState, lastUpdated: Date.now() };
        this.currentState = stamped;

        if (stamped.flavors && stamped.flavors.length > 0) {
          saveFlavors(stamped.flavors);
        }

        try {
          localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(stamped));
        } catch (e) {}

        if (this.channel) {
          this.channel.postMessage({
            type: 'KDS_STATE_UPDATE',
            state: stamped,
            meta,
            deviceId: this.deviceId,
          });
        }

        this.notify(stamped, meta);
        this.broadcastToCloud(stamped, meta);
      }

      initCloudCentralizedSync() {
        if (this.sseSource) {
          this.sseSource.close();
          this.sseSource = null;
        }

        const room = this.currentState.roomCode || DEFAULT_ROOM_CODE;

        // Conexión Server-Sent Events en tiempo real global
        try {
          const es = new EventSource(`https://ntfy.sh/${encodeURIComponent(room)}/sse`);
          es.onmessage = (event) => {
            try {
              const payload = JSON.parse(event.data);
              if (payload && payload.message) {
                const parsed = JSON.parse(payload.message);
                if (parsed && parsed.deviceId !== this.deviceId && parsed.state) {
                  this.handleIncomingState(parsed.state, parsed.meta);
                }
              }
            } catch (err) {}
          };
          this.sseSource = es;
        } catch (err) {}

        // Traer el estado más reciente guardado en la nube
        this.fetchCloudState(room);
      }

      initLocalServerSync() {
        if (typeof window !== 'undefined' && window.location && window.location.protocol && window.location.protocol.startsWith('http')) {
          const pollLocal = async () => {
            try {
              const res = await fetch('/api/state');
              if (res.ok) {
                const data = await res.json();
                if (data && data.state && data.state.lastUpdated > (this.currentState.lastUpdated || 0) && data.deviceId !== this.deviceId) {
                  this.handleIncomingState(data.state, data.meta || { action: 'local_sync' });
                }
              }
            } catch (err) {}
          };
          pollLocal();
          setInterval(pollLocal, 2500);
        }
      }

      async fetchCloudState(room) {
        try {
          const res = await fetch(`https://ntfy.sh/${encodeURIComponent(room)}/json?poll=1&since=12h`);
          if (!res.ok) return;
          const text = await res.text();
          const lines = text.trim().split('\n');
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const item = JSON.parse(lines[i]);
              if (item && item.message) {
                const parsed = JSON.parse(item.message);
                if (parsed && parsed.state && parsed.state.lastUpdated) {
                  if (parsed.state.lastUpdated > this.currentState.lastUpdated) {
                    this.handleIncomingState(parsed.state, parsed.meta);
                    break;
                  }
                }
              }
            } catch (err) {}
          }
        } catch (err) {}
      }

      async broadcastToCloud(state, meta) {
        // Enviar a servidor local si estamos en http (ej. iniciar-servidor.bat)
        if (typeof window !== 'undefined' && window.location && window.location.protocol && window.location.protocol.startsWith('http')) {
          try {
            fetch('/api/state', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ state, meta, deviceId: this.deviceId }),
            }).catch(() => {});
          } catch (err) {}
        }

        const room = state.roomCode || DEFAULT_ROOM_CODE;
        try {
          const payload = JSON.stringify({
            deviceId: this.deviceId,
            state,
            meta,
          });
          await fetch(`https://ntfy.sh/${encodeURIComponent(room)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
          });
        } catch (err) {}
      }

      setRoomCode(newRoom) {
        const clean = newRoom.trim() || DEFAULT_ROOM_CODE;
        try {
          localStorage.setItem(STORAGE_ROOM_KEY, clean);
        } catch (e) {}

        const next = { ...this.currentState, roomCode: clean, lastUpdated: Date.now() };
        this.publishState(next);
        this.initCloudCentralizedSync();
      }
    }

          soundEngine.play86Alert();
          return;
        }
        soundEngine.playTapSound(520);
        setCart((prev) => ({
          ...prev,
          [flavor.id]: (prev[flavor.id] || 0) + 1,
        }));
      };

      const handleAdjustQuantity = (e, flavor, delta) => {
        e.stopPropagation();
        if (!flavor.available && delta > 0) {
          soundEngine.play86Alert();
          return;
        }
        soundEngine.playTapSound(delta > 0 ? 580 : 380);
        setCart((prev) => {
          const nextQty = (prev[flavor.id] || 0) + delta;
          if (nextQty <= 0) {
            const copy = { ...prev };
            delete copy[flavor.id];
            return copy;
          }
          return { ...prev, [flavor.id]: nextQty };
        });
      };

      const toggleQuickNote = (chip) => {
        soundEngine.playTapSound(460);
        setNote((prev) => {
          const parts = prev
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
          if (parts.includes(chip)) {
            return parts.filter((p) => p !== chip).join(', ');
          }
          return [...parts, chip].join(', ');
        });
      };

      const totalUnits = Object.values(cart).reduce((acc, q) => acc + q, 0);

      const handleSubmitOrder = () => {
        if (totalUnits === 0) return;
        const items = flavors
          .filter((f) => (cart[f.id] || 0) > 0)
          .map((f) => ({
            flavorId: f.id,
            flavorName: f.name,
            color: f.color,
            emoji: f.emoji,
            imageKey: f.imageKey,
            imageUrl: f.imageUrl,
            quantity: cart[f.id],
            checked: false,
          }));

        const finalTicket = customTicket.trim() || formattedSeq;

        onCreateOrder({
          ticketNumber: finalTicket,
          customerOrTable: customerOrTable.trim() || 'Barra Directa',
          orderType,
          note: note.trim(),
          items,
        });

        soundEngine.playTapSound(740);
        setFlashSuccess(`✅ Comanda ${finalTicket} enviada a Panadería (${totalUnits} uds)`);
        setTimeout(() => setFlashSuccess(null), 2600);

        setCart({});
        setCustomTicket('');
        setCustomerOrTable('');
        setNote('');
      };

      const recentOrders = [...orders]
        .sort((a, b) => b.createdAt - a.createdAt)
        .slice(0, 12);

      const formatElapsed = (timestamp) => {
        const diffSec = Math.max(0, Math.floor((now - timestamp) / 1000));
        const mins = Math.floor(diffSec / 60);
        const secs = diffSec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 p-3 md:p-5 max-w-[1650px] mx-auto">
          {/* TECLADO CON FOTO REAL DE CADA ROLLO */}
          <div className="lg:col-span-7 xl:col-span-8 flex flex-col gap-4">
            <div className="flex flex-wrap items-center justify-between gap-2 bg-[#4a2e1b]/80 border border-amber-500/30 rounded-2xl px-4 py-3 shadow-md">
              <div className="flex items-center gap-2.5">
                <span className="h-3 w-3 rounded-full bg-amber-400 animate-pulse" />
                <h2 className="text-base md:text-lg font-black tracking-tight text-[#fdf5e6] uppercase">
                  Sabores Bull Market — Toca el Roll para sumar (+1)
                </h2>
              </div>
              <div className="flex items-center gap-2 text-xs md:text-sm text-amber-200/80">
                <span>Disponibles:</span>
                <span className="font-black text-emerald-400">
                  {flavors.filter((f) => f.available).length}
                </span>
                <span>/</span>
                <span className="font-black text-rose-400">
                  {flavors.filter((f) => !f.available).length} Agotados (86)
                </span>
              </div>
            </div>

            {/* Grid de Botones con Foto Circular Real */}
            <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-3">
              {flavors.map((flavor) => {
                const palette = COLOR_PALETTE[flavor.color] || COLOR_PALETTE.amber;
                const qty = cart[flavor.id] || 0;
                const isSelected = qty > 0;
                const imgSrc = getRollImage(flavor);

                return (
                  <div
                    key={flavor.id}
                    onClick={() => handleTapFlavor(flavor)}
                    role="button"
                    tabIndex={0}
                    className={`relative select-none rounded-2xl border-2 p-3 transition-all duration-150 flex flex-col justify-between min-h-[200px] ${
                      !flavor.available
                        ? 'bg-slate-900/40 border-slate-800 opacity-60 cursor-not-allowed'
                        : isSelected
                        ? `bg-[#5c3820] ${palette.border} shadow-xl ${palette.glow} scale-[1.02] cursor-pointer`
                        : `bg-[#3b2313]/90 hover:bg-[#4d2f1a] border-amber-900/60 hover:${palette.border} cursor-pointer active:scale-95`
                    }`}
                  >
                    {!flavor.available && (
                      <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-[1px] rounded-2xl flex flex-col items-center justify-center z-20 p-2 text-center">
                        <span className="inline-flex items-center gap-1.5 bg-rose-600 text-white text-xs font-black uppercase px-3 py-1.5 rounded-full shadow-lg border border-rose-400">
                          🚫 AGOTADO (86)
                        </span>
                        <span className="text-[11px] text-rose-300 mt-1 font-medium">
                          Bloqueado en Barra
                        </span>
                      </div>
                    )}

                    <div className="flex items-center justify-between gap-1 z-10">
                      <span
                        className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-md ${palette.badgeBg}`}

                      {qty > 0 && (
                        <span
                          className={`inline-flex items-center justify-center min-w-[36px] h-9 px-2 rounded-xl text-lg font-black tabular-nums shadow-lg ${palette.badgeBg}`}

                        </span>

                    <div className="my-2 flex flex-col items-center text-center">
                      {imgSrc ? (

                      <p className="mt-2 text-sm md:text-base font-black text-[#fff8eb] uppercase tracking-tight leading-tight">
                        {flavor.name}
                      </p>
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-white/10">
                      {qty > 0 ? (

                          <button

            </div>

            {/* Datos de Comanda */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">

                <div className="sm:col-span-5">

                  </label>

                    onChange={(e) => setCustomerOrTable(e.target.value)}

                  />
                </div>

                <div className="sm:col-span-4">
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1">

                  <div className="grid grid-cols-2 gap-2 h-12">
                    <button
                      type="button"
                      onClick={() => {
                        soundEngine.playTapSound(440);
                        setOrderType('comer_aqui');
                      }}
                      className={`rounded-xl font-bold text-xs md:text-sm flex items-center justify-center gap-1 border transition-all ${
                        orderType === 'comer_aqui'
                          ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300'
                          : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                      }`}
                    >
                      🍽️ Comer Aquí
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        soundEngine.playTapSound(440);
                        setOrderType('para_llevar');
                      }}
                      className={`rounded-xl font-bold text-xs md:text-sm flex items-center justify-center gap-1 border transition-all ${
                        orderType === 'para_llevar'
                          ? 'bg-amber-500/20 border-amber-400 text-amber-300'
                          : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                      }`}
                    >
                      🛍️ Para Llevar
                    </button>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-[11px] font-bold uppercase text-slate-500 mr-1">
                  Ubicación rápida:
                </span>
                {['Barra 1', 'Barra 2', 'Mesa 1', 'Mesa 2', 'Mesa 3', 'Terraza', 'VIP'].map(
                  (preset) => (
                    <button
                      key={preset}
                      type="button"
                      onClick={() => {
                        soundEngine.playTapSound(480);
                        setCustomerOrTable(preset);
                      }}
                      className={`text-xs font-bold px-2.5 py-1 rounded-lg border transition-colors ${
                        customerOrTable === preset
                          ? 'bg-sky-500 text-slate-950 border-sky-400'
                          : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-600'
                      }`}
                    >
                      {preset}
                    </button>
                  )
                )}
              </div>

              <div>
                <label className="block text-xs font-bold uppercase text-slate-400 mb-1.5">
                  📝 Nota Rápida para Panadería
                </label>
                <input
                  type="text"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="Ej. Sin topping, bien caliente, alergia..."
                  className="w-full h-11 rounded-xl bg-slate-950 border border-slate-700 px-3 text-sm font-semibold text-white placeholder:text-slate-500 focus:outline-none focus:border-amber-400 mb-2"
                />
                <div className="flex flex-wrap gap-1.5">
                  {QUICK_NOTES.map((chip) => {
                    const active = note
                      .split(',')
                      .map((s) => s.trim())
                      .includes(chip);
                    return (
                      <button
                        key={chip}
                        type="button"
                        onClick={() => toggleQuickNote(chip)}
                        className={`text-xs font-bold px-3 py-1.5 rounded-lg border transition-all ${
                          active
                            ? 'bg-amber-500 text-slate-950 border-amber-300'
                            : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        + {chip}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* RESUMEN DE COMANDA + BOTÓN GIGANTE + HISTORIAL */}
          <div className="lg:col-span-5 xl:col-span-4 flex flex-col gap-4">
            <div className="bg-slate-900 border-2 border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-xl">
              <div>
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                  <div>
                    <span className="text-xs font-bold uppercase text-slate-400 block">
                      Comanda Actual
                    </span>
                    <div className="flex items-center gap-2">
                      <span className="text-2xl font-black text-amber-400 tabular-nums">
                        {customTicket.trim() || formattedSeq}
                      </span>
                      <span className="text-sm font-bold text-slate-300 truncate max-w-[160px]">
                        • {customerOrTable.trim() || 'Barra Directa'}
                      </span>
                    </div>
                  </div>

                  {totalUnits > 0 && (
                    <button
                      type="button"
                      onClick={() => {
                        soundEngine.playTapSound(300);
                        setCart({});
                        setNote('');
                      }}
                      className="text-xs font-bold text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 px-3 py-2 rounded-xl"
                    >
                      🗑️ Limpiar
                    </button>
                  )}
                </div>

                {totalUnits === 0 ? (
                  <div className="py-8 text-center border border-dashed border-slate-800 rounded-xl bg-slate-950/50 my-2">
                    <p className="text-slate-400 font-bold text-sm">
                      Toca los sabores para armar la comanda
                    </p>
                    <p className="text-xs text-slate-500 mt-1">
                      Se enviará en tiempo real al KDS de Panadería en cualquier dispositivo
                    </p>
                  </div>
                ) : (
                  <div className="space-y-2 max-h-[260px] overflow-y-auto pr-1 my-2">
                    {flavors
                      .filter((f) => (cart[f.id] || 0) > 0)
                      .map((f) => {
                        const palette = COLOR_PALETTE[f.color] || COLOR_PALETTE.amber;
                        const qty = cart[f.id];
                        const imgSrc = getRollImage(f);
                        return (
                          <div
                            key={f.id}
                            className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2"
                          >
                            <div className="flex items-center gap-2.5 min-w-0">
                              {imgSrc ? (
                                <img
                                  src={imgSrc}
                                  alt={f.name}
                                  className="w-10 h-10 rounded-full object-cover border border-amber-400/50 shrink-0"
                                />
                              ) : (
                                <span className="text-xl">{f.emoji}</span>
                              )}
                              <span className="font-extrabold text-white text-sm truncate uppercase">
                                {f.name}
                              </span>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                              <button
                                type="button"
                                onClick={(e) => handleAdjustQuantity(e, f, -1)}
                                className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-rose-600 text-white font-black"
                              >
                                −
                              </button>
                              <span
                                className={`min-w-[34px] text-center font-black text-base tabular-nums px-2 py-0.5 rounded-lg ${palette.badgeBg}`}
                              >
                                {qty}
                              </span>
                              <button
                                type="button"
                                onClick={(e) => handleAdjustQuantity(e, f, 1)}
                                className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-emerald-600 text-white font-black"
                              >
                                +
                              </button>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                )}
              </div>

              {flashSuccess && (
                <div className="my-2 bg-emerald-500/20 border border-emerald-400 text-emerald-200 px-3 py-2.5 rounded-xl text-xs font-bold">
                  {flashSuccess}
                </div>
              )}

              <button
                type="button"
                disabled={totalUnits === 0}
                onClick={handleSubmitOrder}
                className={`mt-3 w-full py-4 px-5 rounded-2xl font-black text-lg md:text-xl uppercase tracking-wide flex items-center justify-between transition-all shadow-xl ${
                  totalUnits > 0
                    ? 'bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 shadow-amber-500/25 active:scale-[0.98] cursor-pointer'
                    : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                }`}
              >
                <span>🚀 Enviar a Panadería</span>
                <span className="bg-slate-950/90 text-amber-400 px-3.5 py-1 rounded-xl text-base font-black tabular-nums">
                  {totalUnits} {totalUnits === 1 ? 'ud' : 'uds'}

              </button>
            </div>

            {/* Historial en Vivo */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-300">

                </h3>

    // ============================================================================
    // 5. VISTA 2: PANTALLA KDS DE PANADERÍA (/panaderia)
    // ============================================================================
    function PanaderiaView({
      flavors,
      orders,
      onUpdateOrderStatus,
      onToggleOrderItemCheck,
      onToggleFlavorAvailability,
    }) {
      const [now, setNow] = useState(Date.now());
      const [discountCheckedItems, setDiscountCheckedItems] = useState(false);
      const [showRecentlyDispatched, setShowRecentlyDispatched] = useState(false);

      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(t);
      }, []);

      const activeOrders = [...orders]
        .filter((o) => o.status === 'pendiente' || o.status === 'preparando')
        .sort((a, b) => a.createdAt - b.createdAt);

      const dispatchedOrders = [...orders]
        .filter((o) => o.status === 'despachado')
        .sort((a, b) => (b.dispatchedAt || b.createdAt) - (a.dispatchedAt || a.createdAt))
        .slice(0, 8);

      const batchTotals = flavors.map((flavor) => {
        let totalInActiveOrders = 0;
        let totalUnchecked = 0;
        activeOrders.forEach((ord) => {
          ord.items.forEach((item) => {
            if (item.flavorId === flavor.id) {
              totalInActiveOrders += item.quantity;
              if (!item.checked) totalUnchecked += item.quantity;
            }
          });
        });
        const displayedCount = discountCheckedItems ? totalUnchecked : totalInActiveOrders;
        const checkedInTray = totalInActiveOrders - totalUnchecked;
        return { flavor, displayedCount, totalInActiveOrders, checkedInTray };
      });

      const totalPendingUnits = batchTotals.reduce((acc, b) => acc + b.displayedCount, 0);

      const getUrgencyLevel = (createdAt) => {
        const elapsedMinutes = (now - createdAt) / 60000;
        if (elapsedMinutes < 3) return 'green';
        if (elapsedMinutes <= 6) return 'yellow';
        return 'red';
      };

      const formatTimer = (createdAt) => {
        const diffSec = Math.max(0, Math.floor((now - createdAt) / 1000));
        const mins = Math.floor(diffSec / 60);
        const secs = diffSec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const formatTimeOfDay = (timestamp) => {
        return new Date(timestamp).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      };

      return (
        <div className="flex flex-col min-h-[calc(100vh-64px)] bg-slate-950 text-white">
          {/* PANEL SUPERIOR FIJO: PRODUCCIÓN EN LOTE CON FOTOS REALES */}
          <section className="sticky top-[64px] z-30 bg-slate-950/95 backdrop-blur-md border-b-2 border-slate-800 px-3 py-3 md:px-6 md:py-3.5 shadow-2xl">
            <div className="max-w-[1800px] mx-auto">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                <div className="flex items-center gap-2.5">
                  <span className="text-xl">🔥</span>
                  <h2 className="text-sm md:text-base font-black uppercase tracking-wider text-white flex items-center gap-2">
                    Consolidado en Vivo por Sabor (Producción en Lote)
                    <span className="bg-amber-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full tabular-nums">
                      {totalPendingUnits} UDS PENDIENTES
                    </span>

                        <div className="min-w-0">

          {showRecentlyDispatched && (
            <div className="bg-slate-900 border-b border-slate-800 px-4 py-3">
              <div className="max-w-[1800px] mx-auto">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-extrabold uppercase text-sky-400">

                <div className="flex flex-wrap gap-2">

          {/* PANEL PRINCIPAL: COLA FIFO */}
          <main className="flex-1 p-3 md:p-6 max-w-[1800px] w-full mx-auto">

                {activeOrders.map((order, fifoIndex) => {
                  const urgency = getUrgencyLevel(order.createdAt);

                  const progressPct =
                    totalOrderUnits > 0

                  const urgencyStyles = {
                    green: {
                      cardBorder:
                        order.status === 'preparando'

                    >
                      <div>
                        <div className={`p-3.5 ${urgencyStyles.headerBg}`}>

                              <div className="flex items-center gap-2">

                                <span className="text-3xl md:text-4xl font-black tracking-tight text-white tabular-nums">
                                  {order.ticketNumber}
                                </span>
                                <span className="text-sm font-extrabold text-slate-200 truncate max-w-[140px]">
                                  {order.customerOrTable}
                                </span>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <div
                                className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-lg font-black tabular-nums shadow ${urgencyStyles.timerBadge}`}
                              >
                                ⏱️ {formatTimer(order.createdAt)}
                              </div>
                              <span className="block text-[11px] font-bold text-slate-300 mt-1">
                                Entró: {formatTimeOfDay(order.createdAt)}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-center justify-between mt-2.5 pt-2 border-t border-white/10 text-xs font-bold">
                            {order.orderType === 'comer_aqui' ? (
                              <span className="text-emerald-300">🍽️ Para Comer Aquí</span>
                            ) : (
                              <span className="text-amber-300">🛍️ Para Llevar</span>
                            )}
                            <span className="bg-slate-950/80 text-white px-2.5 py-0.5 rounded-lg font-black">
                              Total: {totalOrderUnits} uds
                            </span>
                          </div>
                        </div>

                        {order.note && (
                          <div className="mx-3.5 mt-3 bg-amber-500/20 border-l-4 border-amber-400 px-3 py-2 rounded-r-xl">
                            <p className="text-xs md:text-sm font-extrabold text-amber-200">
                              ⚠️ NOTA: {order.note}
                            </p>
                          </div>
                        )}

                        <div className="px-3.5 pt-3">
                          <div className="flex items-center justify-between text-[11px] font-bold text-slate-400 mb-1">
                            <span>Toca cada sabor al poner en bandeja:</span>
                            <span className="text-emerald-400 font-black">
                              {checkedUnits}/{totalOrderUnits} listos ({progressPct}%)
                            </span>
                          </div>
                          <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-emerald-500 transition-all duration-300"
                              style={{ width: `${progressPct}%` }}
                            />
                          </div>
                        </div>

                        <div className="p-3.5 space-y-2">
                          {order.items.map((item) => {
                            const palette =
                              COLOR_PALETTE[item.color] || COLOR_PALETTE.amber;
                            const imgSrc = getRollImage(item);

                            return (
                              <button
                                key={item.flavorId}
                                type="button"
                                onClick={() => {
                                  soundEngine.playTapSound(item.checked ? 380 : 620);
                                  onToggleOrderItemCheck(order.id, item.flavorId);
                                }}
                                className={`w-full rounded-xl border-2 p-2 flex items-center justify-between text-left transition-all active:scale-[0.98] ${
                                  item.checked
                                    ? 'bg-emerald-950/30 border-emerald-600/40 opacity-65'
                                    : `bg-[#3b2313]/90 ${palette.border}`
                                }`}
                              >
                                <div className="flex items-center gap-2 min-w-0">
                                  <span className="text-lg">
                                    {item.checked ? '☑️' : '⬜'}
                                  </span>
                                  {imgSrc ? (
                                    <img
                                      src={imgSrc}
                                      alt={item.flavorName}
                                      className="w-9 h-9 rounded-full object-cover border border-amber-400/50 shrink-0"
                                    />
                                  ) : (
                                    <span className="text-2xl shrink-0">{item.emoji}</span>
                                  )}
                                  <span
                                    className={`font-black text-sm md:text-base uppercase leading-tight truncate ${
                                      item.checked
                                        ? 'line-through text-slate-400'
                                        : 'text-[#fff8eb]'
                                    }`}
                                  >
                                    {item.flavorName}
                                  </span>
                                </div>

                                <span
                                  className={`shrink-0 ml-2 min-w-[44px] h-10 px-2.5 rounded-xl flex items-center justify-center text-xl font-black tabular-nums ${
                                    item.checked
                                      ? 'bg-emerald-600 text-white'
                                      : palette.badgeBg
                                  }`}
                                >
                                  x{item.quantity}
                                </span>
                              </button>
                            );

                        </div>
                      </div>

                      <div className="p-3.5 pt-0 mt-1">
                        {order.status === 'pendiente' ? (
                          <div className="grid grid-cols-12 gap-2">
                            <button
                              type="button"
                              onClick={() => {
                                soundEngine.playTapSound(540);
                                onUpdateOrderStatus(order.id, 'preparando');
                              }}
                              className="col-span-8 py-3.5 px-3 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-black text-sm md:text-base uppercase tracking-wide shadow-lg"
                            >
                              👨‍🍳 Preparar
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                soundEngine.playOrderDispatchedSound();
                                onUpdateOrderStatus(order.id, 'despachado');
                              }}
                              className="col-span-4 py-3.5 px-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-xs uppercase shadow-lg"
                            >
                              ⚡ Listo
                            </button>
                          </div>
                        ) : (
                          <button
                            type="button"
                            onClick={() => {
                              soundEngine.playOrderDispatchedSound();
                              onUpdateOrderStatus(order.id, 'despachado');
                            }}
                            className="w-full py-4 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-400 hover:to-green-400 active:scale-95 text-slate-950 font-black text-base md:text-lg uppercase tracking-wide shadow-xl"
                          >

                          </button>
                        )}

                  );
                })}

            )}
          </main>

      );
    }

    // ============================================================================
    // 6. VISTA 3: ADMIN, SALA CENTRALIZADA, MÉTRICAS Y PRESERVACIÓN DE SABORES
    // ============================================================================
    function AdminView({
      flavors,
      orders,
      roomCode,
      onSaveFlavors,
      onResetDemoData,
      onClearAllOrders,
      onRestoreFactoryFlavors,
      onSetRoomCode,
    }) {
      const [newName, setNewName] = useState('');
      const [newCode, setNewCode] = useState('');
      const [newColor, setNewColor] = useState('amber');
      const [newEmoji, setNewEmoji] = useState('🥐');
      const [newDateRange, setNewDateRange] = useState('23/10 AL 01/11');

      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editCode, setEditCode] = useState('');
      const [editColor, setEditColor] = useState('amber');
      const [editEmoji, setEditEmoji] = useState('🥐');
      const [editDateRange, setEditDateRange] = useState('');

      const [inputRoom, setInputRoom] = useState(roomCode);
      const [feedback, setFeedback] = useState(null);
      const [showFactoryConfirm, setShowFactoryConfirm] = useState(false);

      const handleAddFlavor = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        const code =
          newCode.trim().toUpperCase() ||
          newName.trim().slice(0, 3).toUpperCase();

        const created = {
          id: `flv-${Date.now()}`,
          name: newName.trim().toUpperCase(),
          shortCode: code,
          color: newColor,
          emoji: newEmoji || '🥐',
          dateRange: newDateRange.trim() || '23/10 AL 01/11',
          available: true,
        };

        soundEngine.playTapSound(600);
        onSaveFlavors([...flavors, created]);
        setNewName('');
        setNewCode('');
        setFeedback(`¡Sabor "${created.name}" agregado y guardado!`);
        setTimeout(() => setFeedback(null), 3000);
      };

      const startEditFlavor = (flavor) => {
        setEditingId(flavor.id);
        setEditName(flavor.name);
        setEditCode(flavor.shortCode);
        setEditColor(flavor.color);
        setEditEmoji(flavor.emoji);
        setEditDateRange(flavor.dateRange || '23/10 AL 01/11');
      };

      const saveEditFlavor = (id) => {
        if (!editName.trim()) return;
        soundEngine.playTapSound(580);
        onSaveFlavors(
          flavors.map((f) =>
            f.id === id
              ? {
                  ...f,
                  name: editName.trim().toUpperCase(),
                  shortCode: editCode.trim().toUpperCase() || f.shortCode,
                  color: editColor,
                  emoji: editEmoji,
                  dateRange: editDateRange.trim() || f.dateRange,
                }
              : f
          )
        );
        setEditingId(null);
        setFeedback('Sabor actualizado con éxito');
        setTimeout(() => setFeedback(null), 2500);
      };

      const toggleFlavor86 = (id) => {
        soundEngine.play86Alert();
        onSaveFlavors(
          flavors.map((f) =>
            f.id === id ? { ...f, available: !f.available } : f
          )
        );
      };

      const deleteFlavor = (id) => {
        soundEngine.playTapSound(320);
        onSaveFlavors(flavors.filter((f) => f.id !== id));
      };

      const handleUpdateRoom = (e) => {
        e.preventDefault();
        if (!inputRoom.trim()) return;
        onSetRoomCode(inputRoom.trim());
        setFeedback(`Conectado a la sala "${inputRoom.trim()}"`);
        setTimeout(() => setFeedback(null), 3000);
      };

      const dispatchedOrders = orders.filter((o) => o.status === 'despachado');
      const activeOrders = orders.filter((o) => o.status !== 'despachado');
      const totalDispatchedUnits = dispatchedOrders.reduce(
        (sum, o) => sum + o.items.reduce((s, i) => s + i.quantity, 0),
        0
      );
      const totalAllUnits = orders.reduce(
        (sum, o) => sum + o.items.reduce((s, i) => s + i.quantity, 0),
        0
      );

      const dispatchDurationsSec = dispatchedOrders
        .filter((o) => o.dispatchedAt && o.dispatchedAt > o.createdAt)
        .map((o) => Math.round((o.dispatchedAt - o.createdAt) / 1000));

      const avgDispatchSec =
        dispatchDurationsSec.length > 0
          ? Math.round(
              dispatchDurationsSec.reduce((a, b) => a + b, 0) /
                dispatchDurationsSec.length
            )
          : 0;

      const formatDuration = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}m ${String(s).padStart(2, '0')}s`;
      };

      const flavorRanking = flavors
        .map((f) => {
          let soldDispatched = 0;
          let soldActive = 0;
          orders.forEach((o) => {
            o.items.forEach((item) => {
              if (item.flavorId === f.id || item.flavorName === f.name) {
                if (o.status === 'despachado') soldDispatched += item.quantity;
                else soldActive += item.quantity;
              }
            });
          });
          return {
            flavor: f,
            soldDispatched,
            soldActive,
            totalSold: soldDispatched + soldActive,
          };
        })
        .sort((a, b) => b.totalSold - a.totalSold);

      const maxFlavorSold = Math.max(1, ...flavorRanking.map((r) => r.totalSold));

      const handleExportCSV = () => {
        const rows = [
          ['REPORTE DE CIERRE BULL MARKET - POS & KDS'],
          ['Fecha Exportacion', new Date().toLocaleString()],
          ['Total Comandas Despachadas', String(dispatchedOrders.length)],
          ['Total Unidades Vendidas', String(totalAllUnits)],
          ['Tiempo Promedio Despacho', formatDuration(avgDispatchSec)],
          [],
          ['RANKING POR SABOR'],
          ['Codigo', 'Sabor', 'Despachados', 'En Cola', 'Total', 'Estado'],
          ...flavorRanking.map((r) => [
            r.flavor.shortCode,
            r.flavor.name,
            String(r.soldDispatched),
            String(r.soldActive),
            String(r.totalSold),
            r.flavor.available ? 'DISPONIBLE' : 'AGOTADO (86)',
          ]),
          [],
          ['DETALLE DE COMANDAS'],
          ['Ticket', 'Cliente / Mesa', 'Modalidad', 'Estado', 'Hora', 'Detalle', 'Nota'],
          ...orders.map((o) => [
            o.ticketNumber,
            o.customerOrTable,
            o.orderType === 'comer_aqui' ? 'Comer Aqui' : 'Para Llevar',
            o.status.toUpperCase(),
            new Date(o.createdAt).toLocaleTimeString(),
            o.items.map((i) => `${i.quantity}x ${i.flavorName}`).join(' | '),
            o.note || '',
          ]),
        ];

        const csvContent =
          '\uFEFF' +
          rows
            .map((r) =>
              r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')
            )
            .join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BullMarket-Cierre-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleCopyForGoogleSheets = () => {
        const header = ['Sabor', 'Codigo', 'Despachados', 'En Cola', 'Total', 'Estado'].join('\t');
        const lines = flavorRanking.map((r) =>
          [
            r.flavor.name,
            r.flavor.shortCode,
            r.soldDispatched,
            r.soldActive,
            r.totalSold,
            r.flavor.available ? 'Disponible' : 'Agotado (86)',
          ].join('\t')
        );
        navigator.clipboard.writeText([header, ...lines].join('\n')).then(() => {
          setFeedback('✅ ¡Tabla copiada! Abre Google Sheets y presiona Ctrl+V');
          setTimeout(() => setFeedback(null), 3500);
        });
      };

      return (
        <div className="max-w-[1650px] mx-auto p-3 md:p-6 space-y-6 text-white">
          {/* BANNER DE SINCRONIZACIÓN CENTRALIZADA MULTI-DISPOSITIVO */}
          <section className="bg-gradient-to-r from-sky-950/70 via-slate-900 to-amber-950/50 border-2 border-sky-500/40 rounded-3xl p-4 md:p-5 shadow-xl">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-3 bg-sky-500/20 border border-sky-400 rounded-2xl text-2xl">
                  🌐
                </div>

    // ============================================================================
    // 7. APLICACIÓN PRINCIPAL (SHELL CON NAVEGACIÓN Y MULTI-DISPOSITIVO)
    // ============================================================================
    function App() {
      const [state, setState] = useState(() => getInitialState());
      const [route, setRoute] = useState(() => {
        const hash = window.location.hash.replace('#', '');
        if (hash === '/panaderia' || hash === '/admin' || hash === '/dual') {
          return hash;
        }
        return '/barra';
      });
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [incomingBanner, setIncomingBanner] = useState(null);
      const prevOrderCountRef = useRef(state.orders.length);

      useEffect(() => {
        const unsubscribe = syncEngine.subscribe((newState, meta) => {
          const hadLessOrders = newState.orders.length > prevOrderCountRef.current;
          prevOrderCountRef.current = newState.orders.length;
          setState(newState);

          if (meta?.isNewOrder || hadLessOrders) {
            soundEngine.playNewOrderBell();
            const newest = newState.orders[newState.orders.length - 1];
            if (newest) {
              setIncomingBanner(
                `🔔 ¡NUEVA COMANDA ${newest.ticketNumber} (${newest.customerOrTable}) EN COLA DE PANADERÍA!`
              );
              setTimeout(() => setIncomingBanner(null), 4000);
            }
          }
        });
        return () => unsubscribe();
      }, []);

      const navigate = (nextRoute) => {
        soundEngine.playTapSound(500);
        setRoute(nextRoute);
        window.location.hash = nextRoute;
      };

      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        soundEngine.enabled = next;
        if (next) soundEngine.playNewOrderBell();
      };

      const handleCreateOrder = (orderData) => {
        const newOrder = {
          id: `ord-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          ticketNumber: orderData.ticketNumber,
          customerOrTable: orderData.customerOrTable,
          orderType: orderData.orderType,
          note: orderData.note,
          items: orderData.items,
          status: 'pendiente',
          createdAt: Date.now(),
        };

        const nextState = {
          ...state,
          orders: [...state.orders, newOrder],
          nextTicketSeq: state.nextTicketSeq + 1,
          lastUpdated: Date.now(),
        };

        prevOrderCountRef.current = nextState.orders.length;
        syncEngine.publishState(nextState, {
          isNewOrder: true,
          newOrderTicket: newOrder.ticketNumber,
        });

        if (route === '/panaderia' || route === '/dual') {
          soundEngine.playNewOrderBell();
        }
      };

      const handleUpdateOrderStatus = (orderId, nextStatus) => {
        const now = Date.now();
        const updatedOrders = state.orders.map((ord) => {
          if (ord.id !== orderId) return ord;
          return {
            ...ord,
            status: nextStatus,
            startedAt:
              nextStatus === 'preparando' && !ord.startedAt ? now : ord.startedAt,
            dispatchedAt: nextStatus === 'despachado' ? now : ord.dispatchedAt,
          };
        });
        syncEngine.publishState({ ...state, orders: updatedOrders, lastUpdated: now });
      };

      const handleToggleOrderItemCheck = (orderId, flavorId) => {
        const updatedOrders = state.orders.map((ord) => {
          if (ord.id !== orderId) return ord;
          const nextItems = ord.items.map((item) =>
            item.flavorId === flavorId ? { ...item, checked: !item.checked } : item
          );
          return { ...ord, items: nextItems };
        });
        syncEngine.publishState({
          ...state,
          orders: updatedOrders,
          lastUpdated: Date.now(),
        });
      };

      const handleToggleFlavorAvailability = (flavorId) => {
        const updatedFlavors = state.flavors.map((f) =>
          f.id === flavorId ? { ...f, available: !f.available } : f
        );
        syncEngine.publishState({
          ...state,
          flavors: updatedFlavors,
          lastUpdated: Date.now(),
        });
      };

      const handleSaveFlavors = (nextFlavors) => {
        syncEngine.publishState({
          ...state,
          flavors: nextFlavors,
          lastUpdated: Date.now(),
        });
      };

      // Iniciar Nuevo Día: LIMPIA COMANDAS Y CONSERVA TODOS LOS SABORES CREADOS
      const handleClearAllOrders = () => {
        soundEngine.playTapSound(350);
        prevOrderCountRef.current = 0;
        syncEngine.publishState({
          ...state,
          // Conserva siempre los sabores creados
          orders: [],
          nextTicketSeq: 1,
          lastUpdated: Date.now(),
        });
      };

      // Cargar Demo: CONSERVA LOS SABORES CREADOS
      const handleResetDemoData = () => {
        soundEngine.playNewOrderBell();
        const currentFlavors = state.flavors && state.flavors.length > 0 ? state.flavors : INITIAL_FLAVORS;
        const demoOrders = createInitialDemoOrders(currentFlavors);
        prevOrderCountRef.current = demoOrders.length;
        syncEngine.publishState({
          ...state,
          flavors: currentFlavors,
          orders: demoOrders,
          nextTicketSeq: demoOrders.length + 1,
          lastUpdated: Date.now(),
        });
      };

      // Restaurar Fábrica: SOLO SI SE CONFIRMA
      const handleRestoreFactoryFlavors = () => {
        soundEngine.play86Alert();
        syncEngine.publishState({
          ...state,
          flavors: INITIAL_FLAVORS,
          lastUpdated: Date.now(),
        });
      };

      const activeOrderCount = state.orders.filter(
        (o) => o.status === 'pendiente' || o.status === 'preparando'
      ).length;

      const totalPendingUnits = state.orders
        .filter((o) => o.status === 'pendiente' || o.status === 'preparando')
        .reduce((sum, o) => sum + o.items.reduce((s, i) => s + i.quantity, 0), 0);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* HEADER SUPERIOR CON INDICADOR MULTI-DISPOSITIVO */}
          <header className="sticky top-0 z-40 h-[64px] bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 md:px-6 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2.5 shrink-0">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-md">
                🐂
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-black text-base md:text-lg tracking-tight text-white">
                    BULL MARKET
                  </span>
                  <span className="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                    ● MULTI-DISPOSITIVO EN VIVO
                  </span>
                </div>
                <span className="block text-[10px] font-bold uppercase tracking-wider text-amber-400/90 -mt-0.5">
                  Sala: {state.roomCode || DEFAULT_ROOM_CODE}
                </span>
              </div>
            </div>

            <nav className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-2xl border border-slate-800">
              <button
                type="button"
                onClick={() => navigate('/barra')}
                className={`px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-xs md:text-sm transition-all ${
                  route === '/barra'
                    ? 'bg-amber-500 text-slate-950 shadow-md'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                🍹 1. Barra
              </button>

              <button
                type="button"
                onClick={() => navigate('/panaderia')}
                className={`px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-xs md:text-sm flex items-center gap-1.5 transition-all ${
                  route === '/panaderia'
                    ? 'bg-orange-500 text-slate-950 shadow-md'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                <span>🔥 2. Panadería KDS</span>
                {activeOrderCount > 0 && (
                  <span
                    className={`px-1.5 py-0.2 rounded-full text-[11px] font-black tabular-nums ${
                      route === '/panaderia'
                        ? 'bg-slate-950 text-amber-400'
                        : 'bg-orange-500 text-slate-950'
                    }`}
                  >
                    {activeOrderCount} ({totalPendingUnits})
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={() => navigate('/admin')}
                className={`px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-xs md:text-sm transition-all ${
                  route === '/admin'
                    ? 'bg-sky-500 text-slate-950 shadow-md'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                ⚙️ 3. Admin &amp; 86
              </button>

              <button
                type="button"
                onClick={() => navigate('/dual')}
                className={`hidden xl:inline-flex px-3 py-1.5 rounded-xl font-extrabold text-xs transition-all ${
                  route === '/dual'
                    ? 'bg-emerald-500 text-slate-950 shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                🖥️ Vista Dual
              </button>
            </nav>

            <div className="flex items-center gap-2 shrink-0">
              <button
                type="button"
                onClick={() => soundEngine.playNewOrderBell()}
                className="hidden sm:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold border border-slate-700"
              >
                🔔 Campana
              </button>

              <button
                type="button"
                onClick={toggleSound}
                className={`px-2.5 py-1.5 rounded-xl border text-xs font-bold ${
                  soundEnabled
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400'
                    : 'bg-rose-500/15 border-rose-500/40 text-rose-400'
                }`}
              >
                {soundEnabled ? '🔊 Audio ON' : '🔇 Mute'}
              </button>

              <button
                type="button"
                onClick={() => {
                  const url = `${window.location.href.split('#')[0]}#/panaderia`;
                  window.open(url, '_blank', 'width=1280,height=820');
                }}
                className="hidden md:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700"
              >
                ↗️ Abrir KDS
              </button>
            </div>
          </header>

          {incomingBanner && (
            <div className="bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 text-slate-950 font-black text-center py-2 px-4 text-sm uppercase tracking-wider shadow-lg animate-bounce z-50">
              {incomingBanner}
            </div>
          )}

          <div className="flex-1">
            {route === '/barra' && (
              <BarraView
                flavors={state.flavors}
                orders={state.orders}
                nextTicketSeq={state.nextTicketSeq}
                onCreateOrder={handleCreateOrder}
              />
            )}

            {route === '/panaderia' && (
              <PanaderiaView
                flavors={state.flavors}
                orders={state.orders}
                onUpdateOrderStatus={handleUpdateOrderStatus}
                onToggleOrderItemCheck={handleToggleOrderItemCheck}
                onToggleFlavorAvailability={handleToggleFlavorAvailability}
              />
            )}

            {route === '/admin' && (
              <AdminView
                flavors={state.flavors}
                orders={state.orders}
                roomCode={state.roomCode}
                onSaveFlavors={handleSaveFlavors}
                onResetDemoData={handleResetDemoData}
                onClearAllOrders={handleClearAllOrders}
                onRestoreFactoryFlavors={handleRestoreFactoryFlavors}
                onSetRoomCode={(r) => syncEngine.setRoomCode(r)}
              />
            )}

            {route === '/dual' && (
              <div className="grid grid-cols-1 xl:grid-cols-12 divide-y xl:divide-y-0 xl:divide-x divide-slate-800">
                <div className="xl:col-span-5 bg-slate-950">
                  <div className="bg-amber-500/10 border-b border-amber-500/30 px-4 py-2 text-xs font-black uppercase text-amber-400">
                    🍹 Vista Emisor de Barra (/barra)
                  </div>
                  <BarraView
                    flavors={state.flavors}
                    orders={state.orders}
                    nextTicketSeq={state.nextTicketSeq}
                    onCreateOrder={handleCreateOrder}
                  />
                </div>
                <div className="xl:col-span-7 bg-slate-950">
                  <div className="bg-orange-500/10 border-b border-orange-500/30 px-4 py-2 text-xs font-black uppercase text-orange-400">
                    🔥 Vista KDS Panadería en Vivo (/panaderia)
                  </div>
                  <PanaderiaView
                    flavors={state.flavors}
                    orders={state.orders}
                    onUpdateOrderStatus={handleUpdateOrderStatus}
                    onToggleOrderItemCheck={handleToggleOrderItemCheck}
                    onToggleFlavorAvailability={handleToggleFlavorAvailability}
                  />
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
